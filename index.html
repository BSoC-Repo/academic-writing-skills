    const move = i => { AS.i = i; render(); const h = document.getElementById('aq-q'); if (h) h.focus(); };
    main.querySelector('#aq-prev').addEventListener('click', () => move(AS.i - 1));
    const nx = main.querySelector('#aq-next'); if (nx) nx.addEventListener('click', () => move(AS.i + 1));
    main.querySelectorAll('.qn').forEach(b => b.addEventListener('click', () => move(+b.dataset.i)));
    const fin = main.querySelector('#aq-finish');
    if (fin) fin.addEventListener('click', () => {
      const missing = AS.qs.map((qq, i) => (isAnswered(qq, AS.answers[i]) ? null : i + 1)).filter(Boolean);
      const msg = main.querySelector('#aq-msg');
      if (missing.length) {
        msg.innerHTML = `<div class="feedback note"><p>${ICON.info} You have ${missing.length} unanswered question${missing.length === 1 ? '' : 's'} (${missing.join(', ')}). Unanswered questions are marked as incorrect.</p><div class="actions"><button type="button" class="btn btn-ghost btn-sm" data-a="back">Go to question ${missing[0]}</button><button type="button" class="btn btn-sm" data-a="submit">Submit anyway</button></div></div>`;
        msg.querySelector('[data-a="back"]').addEventListener('click', () => move(missing[0] - 1));
        msg.querySelector('[data-a="submit"]').addEventListener('click', submitAssessment);
        msg.querySelector('[data-a="back"]').focus();
      } else submitAssessment();
    });
    main.querySelector('#aq-abandon').addEventListener('click', async () => {
      const yes = await confirmAction('Abandon this attempt?', 'Your answers for this attempt will be discarded and not recorded.', 'Abandon attempt');
      if (yes) { AS = null; render(); }
    });
    return `Final assessment: question ${AS.i + 1}`;
  }
  function submitAssessment() {
    let score = 0;
    const byTopic = {};
    AS.qs.forEach((q, i) => {
      const ok = isCorrect(q, AS.answers[i]);
      if (ok) score++;
      byTopic[q.topic] = byTopic[q.topic] || [0, 0];
      byTopic[q.topic][1]++;
      if (ok) byTopic[q.topic][0]++;
    });
    AS.submitted = true;
    AS.result = { score, total: AS.qs.length, byTopic, date: Date.now() };
    S.assessment.attempts.push(AS.result);
    save();
    render();
    announce(`Assessment submitted. You scored ${score} of ${AS.qs.length}.`);
  }
  function answerText(q, a) {
    if (q.type === 'set') return q.sOrder.map((si, k) => { const v = a && a[si] !== '' && a[si] != null ? q.choices[+a[si]] : 'not answered'; return `${k + 1}. ${v}`; }).join('; ');
    return a == null ? 'Not answered' : q.options[+a];
  }
  function correctText(q) {
    if (q.type === 'set') return q.sOrder.map((si, k) => `${k + 1}. ${q.choices[q.statements[si].a]}`).join('; ');
    return q.options[q.answer];
  }
  function renderAssessResults(main) {
    const r = AS.result;
    const p = pct(r.score, r.total);
    const band = p >= 80 ? { h: 'Secure understanding', m: 'You have a strong grasp of academic writing conventions. Use the recommendations below to refine any remaining areas, and apply your skills in the writing workshop.' }
      : p >= 60 ? { h: 'Developing understanding', m: 'You have a solid foundation. Revisiting the topics identified below will help you to strengthen your understanding.' }
      : { h: 'Building understanding', m: 'This assessment has identified several areas to revisit. Working through the recommended topics and their activities will help to build your confidence.' };
    const recs = TOPICS.map(t => ({ t, res: r.byTopic[t.id] || [0, 0] })).filter(x => x.res[1] && x.res[0] < x.res[1]).sort((a, b) => a.res[0] / a.res[1] - b.res[0] / b.res[1]);
    main.innerHTML = `
      <header class="page-head"><p class="eyebrow">Final knowledge assessment</p><h1>Your results</h1></header>
      <section class="card result-hero" aria-labelledby="res-h">
        <div class="score-ring" aria-hidden="true" style="--p:${p}"><span>${p}%</span></div>
        <div><h2 id="res-h">${band.h}</h2><p class="score-line">You scored <strong>${r.score} of ${r.total}</strong> (${p}%).</p><p>${band.m}</p>
        <div class="actions"><button type="button" class="btn" id="as-retry">Retake the assessment</button><a class="btn btn-ghost" href="#/summary">View progress summary</a></div></div>
      </section>
      <section class="card" aria-labelledby="bt-h">
        <h2 id="bt-h">Results by topic</h2>
        <div class="table-wrap"><table class="by-topic"><caption class="sr-only">Assessment results for each topic</caption><thead><tr><th scope="col">Topic</th><th scope="col">Score</th><th scope="col">Status</th></tr></thead><tbody>
        ${TOPICS.map(t => { const [c, n] = r.byTopic[t.id] || [0, 0]; const s = c === n ? 'Secure' : c === 0 ? 'Priority to revisit' : 'Review recommended'; const cls = c === n ? 'ok' : c === 0 ? 'no' : 'mid'; return `<tr><th scope="row"><a href="#/topic/${t.num}">${t.num}. ${t.title}</a></th><td>${c} of ${n}</td><td><span class="pill pill-${cls}">${c === n ? ICON.ok : ICON.info} ${s}</span></td></tr>`; }).join('')}
        </tbody></table></div>
      </section>
      <section class="card" aria-labelledby="rec-h">
        <h2 id="rec-h">Personalised recommendations</h2>
        ${recs.length ? `<ol class="recs">${recs.map(x => `<li><strong>${x.res[0] === 0 ? 'Priority' : 'Review'}:</strong> revisit <a href="#/topic/${x.t.num}">Topic ${x.t.num}: ${x.t.title}</a> to practise ${x.t.focus}. Try its activities again, then retake the knowledge check.</li>`).join('')}</ol>` : `<p>${ICON.ok} You answered every question correctly. Consolidate your skills in the <a href="#/workshop">writing workshop</a>, and apply them to your next assignment.</p>`}
      </section>
      <section class="card" aria-labelledby="rv-h">
        <h2 id="rv-h">Review your answers</h2>
        <p><label class="inline-check"><input type="checkbox" id="rv-filter"> Show only questions to review</label></p>
        <ol class="review-list">
          ${AS.qs.map((q, i) => { const ok = isCorrect(q, AS.answers[i]); const t = TOPICS.find(x => x.id === q.topic); return `<li class="review ${ok ? 'ok' : 'no'}" data-ok="${ok}">
            <p class="rv-head">${ok ? ICON.ok : ICON.no} <strong>${ok ? 'Correct' : 'Incorrect'}</strong> · <span class="tag">${TYPE_LABEL[q.type]}</span> <span class="muted small">Topic ${t.num}: ${t.short}</span></p>
            <p class="rv-q">${q.q}</p>
            ${q.type === 'set' ? `<ol class="rv-statements">${q.sOrder.map(si => `<li>${q.statements[si].t}</li>`).join('')}</ol>` : ''}
            <p><strong>Your answer:</strong> ${answerText(q, AS.answers[i])}</p>
            ${ok ? '' : `<p><strong>Correct answer:</strong> ${correctText(q)}</p>`}
            <p class="rv-explain">${q.explain}</p></li>`; }).join('')}
        </ol>
      </section>`;
    main.querySelector('#as-retry').addEventListener('click', () => { startAssessment(); render(); });
    main.querySelector('#rv-filter').addEventListener('change', e => {
      main.querySelectorAll('.review').forEach(li => { li.hidden = e.target.checked && li.dataset.ok === 'true'; });
    });
    return 'Assessment results';
  }

  /* ---------- Progress summary ---------- */
  function developmentAreas() {
    const latest = S.assessment.attempts[S.assessment.attempts.length - 1];
    return TOPICS.map(t => {
      const reasons = []; let priority = 0;
      const st = S.topics[t.id];
      if (latest && latest.byTopic[t.id]) { const [c, n] = latest.byTopic[t.id]; if (c < n) { reasons.push(`final assessment: ${c} of ${n} correct`); priority += c === 0 ? 3 : 2; } }
      if (st && st.check) { const f = st.check.score / st.check.total; if (f < 0.75) { reasons.push(`knowledge check: ${st.check.score} of ${st.check.total}`); priority += f < 0.5 ? 2 : 1; } }
      if (!isComplete(t)) { reasons.push('topic not yet completed'); priority += 0.5; }
      return { t, reasons, priority };
    }).filter(x => x.reasons.length).sort((a, b) => b.priority - a.priority);
  }
  function renderSummary(main) {
    const done = completedCount();
    const at = S.assessment.attempts;
    const latest = at[at.length - 1];
    const best = at.length ? at.reduce((m, a) => (a.score / a.total > m.score / m.total ? a : m), at[0]) : null;
    const checks = TOPICS.map(t => S.topics[t.id] && S.topics[t.id].check).filter(Boolean);
    const avgCheck = checks.length ? Math.round(checks.reduce((s, c) => s + c.score / c.total, 0) / checks.length * 100) : null;
    const areas = developmentAreas();
    main.innerHTML = `
      <header class="page-head"><p class="eyebrow">Your learning</p><h1>Progress summary</h1>
      <p class="lead">An overview of your progress, areas for further development and a revision checklist you can print. Generated ${fmtDate(Date.now())}.</p></header>
      ${Store.ok ? '' : `<p class="callout warn">${ICON.info} Browser storage is unavailable, so this summary only reflects activity since the page was opened.</p>`}
      <section class="dash-grid" aria-label="Summary statistics">
        <div class="stat card"><p class="stat-label">Topics completed</p><p class="stat-value">${done}<span>/ ${TOPICS.length}</span></p>${progressBar(pct(done, TOPICS.length), 'Topics completed')}</div>
        <div class="stat card"><p class="stat-label">Average knowledge check</p><p class="stat-value">${avgCheck != null ? `${avgCheck}<span>%</span>` : '<span class="small-val">No checks yet</span>'}</p><p class="small muted">${checks.length} of ${TOPICS.length} checks attempted</p></div>
        <div class="stat card"><p class="stat-label">Final assessment</p><p class="stat-value">${latest ? `${pct(latest.score, latest.total)}<span>%</span>` : '<span class="small-val">Not attempted</span>'}</p>${best ? `<p class="small muted">Latest attempt · best ${pct(best.score, best.total)}% · ${at.length} attempt${at.length === 1 ? '' : 's'}</p>` : ''}</div>
        <div class="stat card"><p class="stat-label">Writing workshop</p><p class="stat-value small-val">${S.workshop.done ? 'Completed' : 'Not completed'}</p><p class="small muted">Completed when a draft of 100+ words is self-assessed against all criteria.</p></div>
      </section>
      <section class="card" aria-labelledby="sum-t">
        <h2 id="sum-t">Topic progress</h2>
        <div class="table-wrap"><table class="summary-table"><caption class="sr-only">Progress for each topic</caption>
          <thead><tr><th scope="col">Topic</th><th scope="col">Status</th><th scope="col">Practice</th><th scope="col">Knowledge check</th><th scope="col">Assessment (latest)</th></tr></thead>
          <tbody>${TOPICS.map(t => { const st = S.topics[t.id]; const c = st && st.check; const ar = latest && latest.byTopic[t.id]; return `<tr><th scope="row"><a href="#/topic/${t.num}">${t.num}. ${t.title}</a></th><td>${statusBadge(t)}</td><td>${tasksDone(t)} of ${t.activities.length}</td><td>${c ? `${c.score} of ${c.total}` : 'Not yet'}</td><td>${ar ? `${ar[0]} of ${ar[1]}` : 'Not yet'}</td></tr>`; }).join('')}</tbody>
        </table></div>
      </section>
      <section class="card" aria-labelledby="sum-dev">
        <h2 id="sum-dev">Areas for further development</h2>
        ${areas.length ? `<ol class="recs">${areas.map(x => `<li><a href="#/topic/${x.t.num}">Topic ${x.t.num}: ${x.t.title}</a>: focus on ${x.t.focus}. <span class="muted small">(Based on: ${x.reasons.join('; ')}.)</span></li>`).join('')}</ol>` : `<p>${ICON.ok} No areas currently identified. Keep applying your skills, and revisit the revision checklist before each assignment.</p>`}
      </section>
      <section class="card revision" aria-labelledby="sum-rev">
        <h2 id="sum-rev">Revision checklist</h2>
        <p>Tick each point when you are confident you can apply it in your own writing. ${Store.ok ? 'Your ticks are saved in this browser.' : ''}</p>
        <div class="rev-grid">${TOPICS.map(t => `<fieldset class="rev-topic"><legend>Topic ${t.num}: ${t.title}</legend><ul class="check-list">${t.keyPoints.map((k, i) => { const key = `${t.id}-${i}`; const cid = nid('rv'); return `<li><input type="checkbox" id="${cid}" data-key="${key}" ${S.revision[key] ? 'checked' : ''}><label for="${cid}">${k}</label></li>`; }).join('')}</ul></fieldset>`).join('')}</div>
      </section>
      <div class="actions no-print">
        <button type="button" class="btn" id="sum-print">${ICON.print} Print summary and checklist</button>
        <button type="button" class="btn btn-danger" id="sum-reset">Reset all progress</button>
      </div>`;
    main.querySelectorAll('.revision input[type="checkbox"]').forEach(c => c.addEventListener('change', () => { S.revision[c.dataset.key] = c.checked; save(); }));
    main.querySelector('#sum-print').addEventListener('click', () => window.print());
    main.querySelector('#sum-reset').addEventListener('click', resetProgress);
    return 'Progress summary';
  }

  /* ---------- Help ---------- */
  function renderHelp(main) {
    main.innerHTML = `
      <header class="page-head"><p class="eyebrow">Getting started</p><h1>How to use this resource</h1>
      <p class="lead">Everything you need to open, navigate and get the most from this interactive resource.</p></header>
      <div class="help-grid">
      <section class="card prose" aria-labelledby="h1-open">
        <h2 id="h1-open">Opening the resource</h2>
        <ul>
          <li>The resource is a single HTML file. Open it in a modern browser such as Microsoft Edge, Google Chrome, Mozilla Firefox or Safari, by double-clicking the file, or by following a link from your virtual learning environment.</li>
          <li>No internet connection, installation or account is required once the file is open.</li>
        </ul>
      </section>
      <section class="card prose" aria-labelledby="h1-nav">
        <h2 id="h1-nav">Finding your way around</h2>
        <ul>
          <li>Use the <strong>menu</strong> (on the left, or the <strong>Menu</strong> button on smaller screens) to move between topics and tools. Each topic shows whether it is not started, in progress or completed, using both an icon and text.</li>
          <li>Each topic follows the same structure: learning objectives, introduction, worked examples, practice and feedback, reflection and a knowledge check. Use the &lsquo;Sections in this topic&rsquo; links to jump between them.</li>
          <li>The <strong>Glossary</strong> button at the top of every page opens a searchable list of terms. Underlined terms within topics also open the glossary.</li>
          <li>The <strong>Dark mode</strong> button at the top of every page switches between light and dark themes. Until you choose, the resource follows your device's setting, and your choice is remembered in this browser.</li>
          <li>A topic is marked as completed when you have finished all its practice activities and submitted its knowledge check.</li>
        </ul>
      </section>
      <section class="card prose" aria-labelledby="h1-kb">
        <h2 id="h1-kb">Keyboard and assistive technology</h2>
        <ul>
          <li>Everything can be used with a keyboard. Use <kbd>Tab</kbd> and <kbd>Shift</kbd> + <kbd>Tab</kbd> to move between controls, <kbd>Enter</kbd> or <kbd>Space</kbd> to activate them, and arrow keys within groups of options.</li>
          <li>Sequencing activities use <strong>Move up</strong> and <strong>Move down</strong> buttons; classification activities use a <strong>Category</strong> menu on each card. Drag and drop is optional.</li>
          <li>Press <kbd>Escape</kbd> to close the glossary, confirmation dialogs and the mobile menu.</li>
          <li>Feedback is announced to screen readers, and correct and incorrect answers are always indicated with text and icons, not colour alone.</li>
          <li>Animations are minimised if your device is set to reduce motion.</li>
        </ul>
      </section>
      <section class="card prose" aria-labelledby="h1-data">
        <h2 id="h1-data">Your progress and privacy</h2>
        <ul>
          <li>Your progress, reflections and drafts are stored <strong>only in this browser on this device</strong>, using browser storage. Nothing is sent to any server, and your tutor cannot see your answers.</li>
          <li>Progress will not transfer to another device or browser, and may be cleared if you clear your browsing data or use a private window.</li>
          <li>${Store.ok ? `${ICON.ok} Browser storage is currently available, so your progress is being saved.` : `${ICON.info} Browser storage is currently <strong>unavailable</strong> (for example, because of privacy settings or the way the page is embedded). The resource still works, but progress will be lost when the page is closed.`}</li>
          <li>You can clear all saved progress from the <a href="#/summary">Progress summary</a> page.</li>
        </ul>
      </section>
      <section class="card prose" aria-labelledby="h1-print">
        <h2 id="h1-print">Printing and saving</h2>
        <ul>
          <li>The <a href="#/summary">Progress summary</a> page includes a revision checklist and a <strong>Print</strong> button. The printed version hides navigation and buttons. You can also choose &lsquo;Save as PDF&rsquo; in your browser's print dialogue.</li>
          <li>In the writing workshop, use <strong>Save a copy (.txt)</strong> to keep your draft and self-assessment.</li>
        </ul>
      </section>
      <section class="card prose" aria-labelledby="h1-vle">
        <h2 id="h1-vle">Using the resource in Canvas or another VLE (for staff)</h2>
        <ul>
          <li><strong>Simplest option:</strong> upload the HTML file to the course Files area and link to it from a module item or page, so that it opens in a new browser tab. Progress saving normally works in this mode.</li>
          <li><strong>Embedding:</strong> the file can be embedded in a page using an iframe. Some browsers restrict storage in embedded content, in which case the resource will still work but progress will not be saved between visits, and the resource tells students when this happens. When embedded, an <strong>Open in new tab</strong> button appears in the header so students can open the full-size version at any time. Ready-made iframe code is supplied in <em>vle-embed-code.html</em> alongside this file.</li>
          <li>The resource has no external dependencies, so it works on networks with restricted internet access.</li>
          <li>Teaching content is held in clearly labelled data structures in the source files and can be adapted to reflect Blackpool and The Fylde College guidance (for example, a local Harvard variant).</li>
        </ul>
      </section>
      <section class="card prose" aria-labelledby="h1-limits">
        <h2 id="h1-limits">Important limitations</h2>
        <ul>
          <li>The automated checks in the writing workshop identify simple surface patterns only. They cannot assess the quality of your writing and cannot detect plagiarism or AI use.</li>
          <li>All authors, studies and sources in examples are fictional. Referencing guidance follows Harvard (Cite Them Right); Blackpool and The Fylde College's guidance takes priority.</li>
        </ul>
      </section>
      </div>`;
    return 'How to use this resource';
  }

  /* ---------- Light / dark theme ---------- */
  // With no saved choice the theme follows the device setting; the toggle stores an explicit choice.
  const THEME_KEY = 'aws-theme';
  const darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function currentTheme() {
    const t = document.documentElement.getAttribute('data-theme');
    if (t === 'light' || t === 'dark') return t;
    return darkQuery && darkQuery.matches ? 'dark' : 'light';
  }
  function syncThemeButton() {
    document.getElementById('theme-btn').setAttribute('aria-pressed', currentTheme() === 'dark' ? 'true' : 'false');
  }
  function toggleTheme() {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* choice lasts for this visit only */ }
    syncThemeButton();
    announce(next === 'dark' ? 'Dark mode on.' : 'Light mode on.');
  }

  /* ---------- Embedding in a VLE ---------- */
  // When shown inside an iframe, offer a link that opens the same file full size in a new tab.
  function setUpEmbedding() {
    let embedded;
    try { embedded = window.self !== window.top; } catch (e) { embedded = true; }
    if (!embedded) return;
    document.documentElement.classList.add('is-embedded');
    const link = document.getElementById('newtab-link');
    link.href = location.href.split('#')[0];
    link.hidden = false;
  }

  /* ---------- Global events and start-up ---------- */
  function init() {
    buildNav();
    setUpEmbedding();
    syncThemeButton();
    document.getElementById('theme-btn').addEventListener('click', toggleTheme);
    if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener('change', syncThemeButton);
    document.getElementById('menu-btn').addEventListener('click', () => {
      if (document.body.classList.contains('nav-open')) closeMenu(true); else openMenu();
    });
    document.getElementById('scrim').addEventListener('click', () => closeMenu(true));
    document.getElementById('glossary-btn').addEventListener('click', () => openGlossary(''));
    document.getElementById('gd-search').addEventListener('input', updateGlossaryDialog);
    document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));
    document.getElementById('glossary-dialog').addEventListener('click', e => { if (e.target.id === 'glossary-dialog') e.target.close(); });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.body.classList.contains('nav-open')) closeMenu(true);
    });
    document.addEventListener('click', e => {
      const term = e.target.closest('.term[data-term]');
      if (term) { openGlossary(term.dataset.term); return; }
      const a = e.target.closest('a[href^="#"]');
      if (a && !a.getAttribute('href').startsWith('#/')) {
        const target = document.getElementById(a.getAttribute('href').slice(1));
        if (target) {
          e.preventDefault();
          if (!target.hasAttribute('tabindex')) target.setAttribute('tabindex', '-1');
          target.scrollIntoView({ block: 'start' });
          target.focus({ preventScroll: true });
        }
      }
    });
    window.addEventListener('hashchange', () => {
      if (location.hash === '' || location.hash.startsWith('#/')) render();
    });
    render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
