<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="An interactive academic writing skills resource for Higher Education students at Levels 4, 5 and 6.">
<title>Academic Writing Skills</title>
<script>
/* Apply a saved light/dark choice before the page paints, to avoid a flash of the wrong theme. */
(function () { try { var t = localStorage.getItem('aws-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) { /* storage unavailable: follow the device setting */ } })();
</script>
<style>
/* Academic Writing Skills: styles */
/* Colour scheme: Blackpool and The Fylde College teal on a warm grey backdrop and white page, with Fluent
   neutral greys and status colours. The exact College teal (#0091a8) is used for bars, borders and ticks;
   deeper shades of the same teal are used for text and buttons so they meet WCAG AA contrast. */
:root {
  --bg: #f3f2f1;
  --surface: #ffffff;
  --surface-2: #f3f2f1;
  --text: #323130;
  --muted: #605e5c;
  --border: #e1dfdd;
  --border-strong: #8a8886;
  --primary: #007485;
  --primary-strong: #005661;
  --primary-soft: #e0f2f4;
  --accent: #007485;
  --accent-soft: #e3f4f6;
  --ok: #107c10;
  --ok-soft: #dff6dd;
  --no: #a4262c;
  --no-soft: #fde7e9;
  --mid: #8a5300;
  --mid-soft: #fff4ce;
  --note-soft: #eff8f9;
  --focus: #000000;
  --focus-bg: #ffdd00;
  /* Header uses the BFC palette, taken from the BFC logo's waves. The deep navy keeps all three waves visible. */
  --header: #0a2338;
  --header-text: #ffffff;
  --bfc-navy: #003e66;
  --bfc-teal: #0091a8;
  --bfc-green: #56b29f;
  --bfc-dark-teal: #004e5c;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: Georgia, Cambria, "Times New Roman", serif;
  --side-w: 290px;
  --head-h: 72px;
  --on-primary: #ffffff;
  color-scheme: light;
}
/* Dark theme: follows the device setting unless the learner chooses light or dark with the header toggle. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1a19; --surface: #252423; --surface-2: #323130; --text: #f3f2f1; --muted: #c8c6c4;
    --border: #3b3a39; --border-strong: #8a8886; --primary: #4fc1d2; --primary-strong: #9ee0e9; --primary-soft: #123a40;
    --accent: #4fc1d2; --accent-soft: #143c42; --ok: #92c353; --ok-soft: #1f3a1d; --no: #f1707b; --no-soft: #442726;
    --mid: #f8d22a; --mid-soft: #3d3218; --note-soft: #173237; --focus: #ffdd00;
    --shadow: 0 1px 2px rgba(0,0,0,.4); --on-primary: #1b1a19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1a19; --surface: #252423; --surface-2: #323130; --text: #f3f2f1; --muted: #c8c6c4;
  --border: #3b3a39; --border-strong: #8a8886; --primary: #4fc1d2; --primary-strong: #9ee0e9; --primary-soft: #123a40;
  --accent: #4fc1d2; --accent-soft: #143c42; --ok: #92c353; --ok-soft: #1f3a1d; --no: #f1707b; --no-soft: #442726;
  --mid: #f8d22a; --mid-soft: #3d3218; --note-soft: #173237; --focus: #ffdd00;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --on-primary: #1b1a19;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--head-h) + 16px); }
body { margin: 0; font-family: var(--font); font-size: 1.0625rem; line-height: 1.6; color: var(--text); background: var(--bg); }
img, svg { max-width: 100%; }
a { color: var(--primary); text-underline-offset: 2px; }
a:hover { color: var(--primary-strong); text-decoration-thickness: 2px; }
h1, h2, h3, h4 { line-height: 1.25; margin: 1.6em 0 .5em; color: var(--text); }
h1 { font-family: var(--serif); font-size: clamp(1.75rem, 3.5vw, 2.4rem); font-weight: 700; margin-top: 0; letter-spacing: -.01em; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.15rem; }
h4 { font-size: 1rem; }
p { margin: 0 0 1em; }
ul, ol { padding-left: 1.4em; margin: 0 0 1em; }
li { margin-bottom: .3em; }
kbd { font-family: inherit; font-size: .9em; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 4px; padding: 0 .35em; }
/* Elements with the hidden attribute stay hidden even when a class gives them a display value. */
[hidden] { display: none !important; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
.ic { width: 1.1em; height: 1.1em; vertical-align: -.18em; flex: none; }

/* Focus: high-visibility, independent of colour scheme */
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; box-shadow: 0 0 0 6px var(--focus-bg); border-radius: 3px; }
.topbar :focus-visible { outline-color: var(--focus-bg); box-shadow: none; }
h1:focus, h2:focus, section:focus { outline: none; box-shadow: none; }

.skip-link { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--focus-bg); color: #0b0c0c; padding: .6em 1em; font-weight: 600; border-radius: 0 0 6px 6px; }
.skip-link:focus { top: 0; }

/* ---------- Header ---------- */
.topbar { position: sticky; top: 0; z-index: 40; height: var(--head-h); display: flex; align-items: center; gap: 12px; padding: 0 16px 4px; background: var(--header); color: var(--header-text); }
/* Four-colour BFC stripe along the bottom of the header. */
.topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, var(--bfc-navy) 0 25%, var(--bfc-teal) 25% 50%, var(--bfc-green) 50% 75%, var(--bfc-dark-teal) 75% 100%); }
.brand { display: flex; align-items: center; gap: 14px; color: var(--header-text); text-decoration: none; margin-right: auto; min-width: 0; }
.brand:hover { color: var(--header-text); }
.brand-logo { display: block; height: 52px; width: auto; flex: none; }
.brand-divider { width: 1px; height: 36px; background: rgba(255, 255, 255, .35); flex: none; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-text small { font-weight: 400; opacity: .85; font-size: .78rem; }
.top-actions { display: flex; gap: 8px; }
.top-btn, .menu-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border: 1px solid rgba(255,255,255,.45); border-radius: var(--radius-sm); background: transparent; color: var(--header-text); font: inherit; font-size: .95rem; text-decoration: none; cursor: pointer; }
.top-btn:hover, .menu-btn:hover { background: rgba(255,255,255,.12); color: var(--header-text); }
.menu-btn { display: none; }
.theme-btn[aria-pressed="true"] { background: rgba(255,255,255,.16); }
.theme-btn .ic-sun { display: none; }
.theme-btn[aria-pressed="true"] .ic-sun { display: inline; }
.theme-btn[aria-pressed="true"] .ic-moon { display: none; }

/* ---------- Layout ---------- */
.layout { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: calc(100vh - var(--head-h)); }
.sidebar { position: sticky; top: var(--head-h); height: calc(100vh - var(--head-h)); overflow-y: auto; background: var(--surface); border-right: 1px solid var(--border); padding: 16px 12px 32px; }
#content { padding: 32px clamp(16px, 4vw, 48px) 64px; max-width: 1360px; width: 100%; margin: 0 auto; }
.scrim { display: none; }

.side-progress { padding: 4px 8px 14px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
.side-progress-label { display: flex; justify-content: space-between; font-size: .88rem; margin: 0 0 6px; color: var(--muted); }
.side-progress-label strong { color: var(--text); }
.nav-heading { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 18px 8px 6px; }
.nav-topics, .nav-tools { list-style: none; padding: 0; margin: 0; }
.nav-topics li, .nav-tools li { margin: 0; }
.nav-link { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); color: var(--text); text-decoration: none; font-size: .94rem; line-height: 1.35; }
.nav-link:hover { background: var(--surface-2); color: var(--text); }
.nav-link[aria-current="page"] { background: var(--primary-soft); color: var(--primary-strong); font-weight: 600; box-shadow: inset 3px 0 0 var(--primary); }
.nav-link .ic { margin-top: .12em; color: var(--muted); }
.nav-num { color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-status { display: inline-flex; margin-top: .12em; }
.nav-status .ic { color: var(--border-strong); }
.nav-status.st-progress .ic { color: var(--mid); }
.nav-status.st-complete .ic { color: var(--ok); }

/* ---------- Common components ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: clamp(16px, 3vw, 24px); box-shadow: var(--shadow); margin-bottom: 20px; }
.card > h2:first-child, .card > h3:first-child { margin-top: 0; }
.eyebrow { font-size: .82rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); margin-bottom: .4em; }
.lead { font-size: 1.15rem; color: var(--muted); max-width: 70ch; }
.page-head { margin-bottom: 28px; }
.page-head.compact { margin-bottom: 16px; }
.h-sm { font-size: 1.5rem; }
.tag { display: inline-block; font-size: .78rem; font-weight: 600; padding: .15em .6em; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin: 0 .3em .3em 0; vertical-align: middle; white-space: nowrap; }
.tag-plain { background: var(--surface-2); color: var(--muted); }
.tags { margin: 0 0 12px; }
.badge-ill { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: .1em .5em; border: 1px dashed var(--mid); color: var(--mid); border-radius: 4px; vertical-align: middle; }
.callout { background: var(--note-soft); border-left: 4px solid var(--primary); padding: 12px 16px; border-radius: var(--radius-sm); margin: 1em 0; }
.callout p:last-child { margin-bottom: 0; }
.callout.warn { background: var(--mid-soft); border-left-color: var(--mid); }
.table-wrap { overflow-x: auto; margin: 0 0 1.2em; border: 1px solid var(--border); border-radius: var(--radius-sm); }
table { border-collapse: collapse; width: 100%; font-size: .95rem; background: var(--surface); }
caption { text-align: left; font-weight: 600; padding: 10px 12px; color: var(--muted); font-size: .9rem; }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-top: 1px solid var(--border); }
thead th { background: var(--surface-2); font-weight: 600; }
tbody th { font-weight: 600; }
.prose { max-width: 75ch; }
.example-line { background: var(--surface-2); padding: 10px 14px; border-radius: var(--radius-sm); }
.quote-box { background: var(--surface-2); border-left: 4px solid var(--border-strong); padding: 10px 14px; border-radius: var(--radius-sm); margin: 0 0 1em; }
.ref-pattern { font-size: .95rem; color: var(--muted); margin-bottom: .4em; }
.ref-example { background: var(--surface-2); border: 1px solid var(--border); padding: 10px 14px; border-radius: var(--radius-sm); padding-left: 2.2em; text-indent: -1.4em; }
.progress { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
.progress > span { display: block; height: 100%; background: var(--bfc-teal); border-radius: 999px; transition: width .4s ease; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: .85rem; font-weight: 600; margin-right: 8px; }
.status.st-none { color: var(--muted); }
.status.st-progress { color: var(--mid); }
.status.st-complete { color: var(--ok); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .85rem; font-weight: 600; padding: .1em .6em; border-radius: 999px; }
.pill-ok { background: var(--ok-soft); color: var(--ok); }
.pill-no { background: var(--no-soft); color: var(--no); }
.pill-mid { background: var(--mid-soft); color: var(--mid); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 18px; border-radius: var(--radius-sm); border: 2px solid var(--primary); background: var(--primary); color: var(--on-primary); font: inherit; font-weight: 600; font-size: 1rem; text-decoration: none; cursor: pointer; line-height: 1.25; text-align: center; }
.btn:hover { background: var(--primary-strong); border-color: var(--primary-strong); color: var(--on-primary); }
.btn-ghost { background: transparent; color: var(--primary); }
.btn-ghost:hover { background: var(--primary-soft); color: var(--primary-strong); }
.btn-danger { background: transparent; color: var(--no); border-color: var(--no); }
.btn-danger:hover { background: var(--no-soft); color: var(--no); border-color: var(--no); }
.btn-lg { min-height: 50px; padding: 10px 22px; font-size: 1.05rem; }
.btn-sm { min-height: 38px; padding: 6px 12px; font-size: .92rem; }
.btn:disabled, .icon-btn:disabled { opacity: .45; cursor: not-allowed; }
.link-btn { background: none; border: 0; padding: 0; color: var(--primary); text-decoration: underline; font: inherit; cursor: pointer; }
.icon-btn { display: inline-flex; align-items: center; gap: 4px; min-width: 44px; min-height: 40px; justify-content: center; padding: 4px 8px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font: inherit; font-size: .85rem; cursor: pointer; }
.icon-btn:hover:not(:disabled) { background: var(--surface-2); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 8px; }
.actions.spread { justify-content: space-between; }

/* ---------- Home ---------- */
.hero { padding: 8px 0 12px; }
.hero h1 { font-size: clamp(2rem, 4.5vw, 2.9rem); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin: 24px 0 4px; }
.dash-grid .card { margin-bottom: 0; }
.stat-label { font-size: .85rem; color: var(--muted); font-weight: 600; margin-bottom: .2em; }
.stat-value { font-size: 2rem; font-weight: 700; margin-bottom: .3em; line-height: 1.2; }
.stat-value span { font-size: 1rem; color: var(--muted); font-weight: 600; margin-left: 4px; }
.stat-value .small-val, .small-val { font-size: 1.1rem; color: var(--text); margin-left: 0; }
.dash-grid + .card, .dash-grid + section { margin-top: 20px; }
.tick-list { list-style: none; padding: 0; }
.tick-list li { position: relative; padding-left: 1.8em; }
.tick-list li::before { content: ""; position: absolute; left: .2em; top: .45em; width: .55em; height: .9em; border: solid var(--bfc-teal); border-width: 0 3px 3px 0; transform: rotate(45deg); }
.two-col { columns: 3 280px; column-gap: 28px; }
.two-col li { break-inside: avoid; }
.steps { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; counter-reset: s; }
.steps li { counter-increment: s; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin: 0; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: var(--on-primary); font-weight: 700; font-size: .9rem; margin-bottom: 8px; }
.steps strong { display: block; }
.steps span { font-size: .88rem; color: var(--muted); }
.routes { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
.routes .card { margin: 0; }
.routes h3 { margin-top: 0; font-size: 1.05rem; }
.topic-grid { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.topic-card { position: relative; margin: 0; display: flex; flex-direction: column; border-top: 4px solid var(--border-strong); }
.topic-card.st-progress { border-top-color: var(--mid); }
.topic-card.st-complete { border-top-color: var(--ok); }
.topic-card h3 { margin: 0 0 .4em; font-size: 1.08rem; padding-right: 36px; }
.topic-card h3 a { text-decoration: none; color: var(--text); }
.topic-card h3 a::after { content: ""; position: absolute; inset: 0; }
.topic-card:hover { border-color: var(--primary); }
.topic-card:hover h3 a { color: var(--primary); text-decoration: underline; }
.topic-card:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; box-shadow: 0 0 0 6px var(--focus-bg); }
.topic-card h3 a:focus-visible { outline: none; box-shadow: none; }
.tc-num { position: absolute; top: 12px; right: 16px; font-family: var(--serif); font-size: 1.6rem; font-weight: 700; color: var(--border-strong); margin: 0; line-height: 1; }
.tc-sum { font-size: .93rem; color: var(--muted); flex: 1; }
.tc-meta { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.tool-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px; }
.tool { display: flex; gap: 14px; align-items: flex-start; text-decoration: none; color: var(--text); margin: 0; }
.tool:hover { border-color: var(--primary); color: var(--text); }
.tool > .ic { width: 28px; height: 28px; color: var(--accent); }
.tool strong { display: block; color: var(--primary); margin-bottom: 2px; }
.tool span { font-size: .93rem; color: var(--muted); }

/* ---------- Topic page ---------- */
.topic-progress { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; margin: 12px 0 16px; }
.tp-list { list-style: none; padding: 0; margin: 0 0 6px; display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: .92rem; }
.tp-list li { display: flex; gap: 6px; align-items: flex-start; margin: 0; }
.tp-list .ic { margin-top: .2em; color: var(--border-strong); }
.tp-list li.ok .ic { color: var(--ok); }
.tp-status { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.toc ol { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0; counter-reset: toc; }
.toc li { margin: 0; counter-increment: toc; }
.toc a { display: inline-block; padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px; font-size: .88rem; text-decoration: none; background: var(--surface); }
.toc a::before { content: counter(toc) ". "; color: var(--muted); }
.toc a:hover { border-color: var(--primary); }
.rail-h { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
.key-points, .ws-ref { display: none; }
.rail-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.rail-card ul { margin: 0; padding-left: 1.1em; font-size: .9rem; }
.rail-card li { margin-bottom: .5em; }
.rail-card li:last-child { margin-bottom: 0; }

/* Wide screens: the content area grows to fill the window instead of leaving the right-hand side empty. */
@media (min-width: 1100px) {
  .help-grid, .rev-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 20px; align-items: start; }
  .help-grid .prose { max-width: none; }
  #content .glossary { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 0 32px; }
  dialog .glossary { grid-template-columns: minmax(0, 1fr); }
  .aq-layout { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 20px; align-items: start; }
  .aq-layout .q-nav { position: sticky; top: calc(var(--head-h) + 20px); }
}
@media (min-width: 1280px) {
  .home-top { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); gap: 32px; align-items: center; margin-bottom: 24px; }
  .home-top .dash-grid { margin: 0; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .home-top .stat { padding: 14px 18px; }
  .home-top .stat-value { font-size: 1.6rem; margin-bottom: .15em; }
  .ws-draft-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(260px, 1fr); gap: 24px; align-items: start; }
  .ws-ref { display: block; background: var(--surface-2); border-radius: var(--radius-sm); padding: 14px 16px; margin-top: 14px; font-size: .9rem; }
  .ws-ref ul { list-style: none; padding: 0; margin: 0; }
  .ws-ref li { margin-bottom: .7em; }
}
@media (min-width: 1400px) {
  .topic-layout { display: grid; grid-template-columns: minmax(0, 1fr) 290px; grid-template-areas: "main rail"; gap: 40px; align-items: start; }
  .topic-main { grid-area: main; min-width: 0; }
  .topic-rail { grid-area: rail; position: sticky; top: calc(var(--head-h) + 20px); max-height: calc(100vh - var(--head-h) - 40px); overflow-y: auto; display: grid; gap: 16px; }
  .topic-rail .topic-progress { margin: 0; }
  .topic-rail .tp-list { flex-direction: column; gap: 8px; }
  .toc { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 10px 10px; }
  .toc .rail-h { padding-left: 6px; }
  .toc ol { flex-direction: column; gap: 2px; }
  .toc a { display: block; border: 0; border-radius: var(--radius-sm); padding: 6px 10px; background: none; font-size: .92rem; }
  .toc a:hover { background: var(--surface-2); }
  .toc a[aria-current] { background: var(--primary-soft); color: var(--primary-strong); font-weight: 600; box-shadow: inset 3px 0 0 var(--primary); }
  .key-points { display: block; }
  .topic .prose { max-width: 80ch; }
}
.step { display: inline-grid; place-items: center; width: 30px; height: 30px; margin-right: 10px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-strong); font-size: .95rem; font-weight: 700; vertical-align: 2px; }
section[id^="sec-"] { margin-bottom: 36px; }
.objectives h2, .reflect h2 { margin-top: 0; }
.prose h3 { margin-top: 1.8em; padding-top: .9em; border-top: 1px solid var(--border); }
.peel { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 0 0 1em; }
.peel div { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--bfc-teal); border-radius: var(--radius-sm); padding: 10px 12px; }
.peel dt { font-weight: 700; }
.peel dd { margin: 0; font-size: .93rem; }
.ladder li { margin-bottom: .6em; }
.tag-small { font-size: .75rem; background: var(--surface-2); padding: .1em .5em; border-radius: 4px; margin-left: .4em; color: var(--muted); }
.term { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-decoration: underline dotted; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--accent); cursor: help; }
.term:hover { color: var(--accent); }

/* Examples and panels */
.examples, .more { display: grid; gap: 10px; }
details > summary { cursor: pointer; }
.example, .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.example > summary, .panel > summary { display: flex; align-items: center; gap: 10px; padding: 14px 16px; font-weight: 600; list-style: none; }
.example > summary::-webkit-details-marker, .panel > summary::-webkit-details-marker { display: none; }
.example > summary::before, .panel > summary::after { content: ""; flex: none; width: .55em; height: .55em; border: solid var(--muted); border-width: 0 2px 2px 0; transform: rotate(-45deg); transition: transform .2s; }
.panel > summary::after { margin-left: auto; }
.example[open] > summary::before, .panel[open] > summary::after { transform: rotate(45deg); }
.example > summary .ex-title { flex: 1; }
.example > summary .tag { margin: 0; }
.panel > summary .ic { color: var(--accent); }
.ex-body, .panel-body { padding: 0 16px 16px; }
.panel-body > :last-child { margin-bottom: 0; }
.ex-pair, .ex-three { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-bottom: 12px; }
.ex-box { border-radius: var(--radius-sm); padding: 12px 14px; border: 1px solid var(--border); background: var(--surface-2); }
.ex-box p:last-child { margin: 0; }
.ex-weak { border-left: 4px solid var(--no); }
.ex-strong { border-left: 4px solid var(--ok); }
.ex-d { border-left: 4px solid var(--border-strong); }
.ex-a { border-left: 4px solid var(--primary); }
.ex-c { border-left: 4px solid var(--bfc-teal); }
.ex-label { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: .4em; display: flex; align-items: center; gap: 6px; }
.ex-weak .ex-label { color: var(--no); }
.ex-strong .ex-label { color: var(--ok); }
.ex-why p:last-child { margin-bottom: 0; }

/* ---------- Activities ---------- */
.task { border-top: 4px solid var(--primary); }
.task h3 { margin-top: 0; }
.task-instr p:last-child { margin-bottom: .8em; }
.prev-note { display: flex; gap: 8px; align-items: flex-start; font-size: .92rem; background: var(--ok-soft); color: var(--text); padding: 8px 12px; border-radius: var(--radius-sm); }
.prev-note .ic { color: var(--ok); margin-top: .2em; }
.hint { font-size: .9rem; color: var(--muted); display: flex; gap: 6px; align-items: flex-start; flex-wrap: wrap; }
.hint .ic { margin-top: .2em; }
.q-item { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; background: var(--surface); }
.q-count { font-size: .8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: .3em; }
.options { border: 0; padding: 0; margin: 0 0 12px; min-width: 0; }
.options legend { font-weight: 600; margin-bottom: 8px; padding: 0; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; cursor: pointer; background: var(--surface); }
.opt:hover { border-color: var(--primary); }
.opt input { margin: .3em 0 0; width: 1.15em; height: 1.15em; flex: none; accent-color: var(--primary); }
.opt:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); }
.opt.is-right { border: 2px solid var(--ok); background: var(--ok-soft); }
.opt.is-wrong { border: 2px dashed var(--no); background: var(--no-soft); }
.opt.is-missed { border: 2px dotted var(--ok); }
.opt.is-right .opt-text::after { content: " ✓ Correct"; font-weight: 700; color: var(--ok); white-space: nowrap; }
.opt.is-wrong .opt-text::after { content: " ✗ Your answer"; font-weight: 700; color: var(--no); white-space: nowrap; }
.opt.is-missed:not(.is-right) .opt-text::after { content: " ← Correct answer"; font-weight: 700; color: var(--ok); white-space: nowrap; }
.options.multi .opt.is-missed .opt-text::after { content: " ← Missed"; }
.own { margin: 8px 0 4px; }
.own > summary { color: var(--primary); font-weight: 600; padding: 4px 0; }
.own-body { padding-top: 8px; }
.own-model { margin-top: 12px; background: var(--surface-2); padding: 12px 14px; border-radius: var(--radius-sm); }
textarea, .input, select { font: inherit; color: var(--text); background: var(--surface); border: 2px solid var(--border-strong); border-radius: var(--radius-sm); padding: 8px 10px; width: 100%; }
textarea { display: block; resize: vertical; line-height: 1.55; }
select { width: auto; max-width: 100%; min-height: 42px; }
textarea:focus-visible, .input:focus-visible, select:focus-visible { border-color: var(--focus); }
label { cursor: pointer; }
.field-label { display: block; font-weight: 600; margin: 14px 0 6px; }
.field-meta { display: flex; justify-content: space-between; gap: 12px; font-size: .88rem; color: var(--muted); margin: 6px 0 0; }
.save-state { color: var(--ok); }

.feedback:empty { display: none; }
.feedback { margin-top: 12px; padding: 12px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); border-left-width: 5px; background: var(--note-soft); }
.feedback.ok { border-left-color: var(--ok); background: var(--ok-soft); }
.feedback.no { border-left-color: var(--mid); background: var(--mid-soft); }
.feedback.note { border-left-color: var(--primary); }
.feedback p:last-child { margin-bottom: 0; }
.fb-head { font-weight: 700; display: flex; gap: 6px; align-items: flex-start; }
.fb-head .ic { margin-top: .2em; }
.feedback.ok .fb-head .ic { color: var(--ok); }
.feedback.no .fb-head .ic { color: var(--mid); }
.fb-list { list-style: none; padding: 0; }
.fb-list li { display: block; margin-bottom: .5em; }
.fb-list .ic, .feedback p > .ic:first-child { margin-right: 2px; }
.fb-list.plain { padding: 0; }
.reveal { margin-top: 6px; }
.reveal > summary { color: var(--primary); font-weight: 600; }
.task-summary:empty { display: none; }
.task-summary.done { background: var(--ok-soft); border-radius: var(--radius-sm); padding: 10px 14px; }
.task-summary .ic { color: var(--ok); }

/* Sequence */
.seq-list { list-style: none; padding: 0; margin: 0; }
.seq-item { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px; margin-bottom: 8px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); cursor: grab; }
.seq-item.dragging { opacity: .5; }
.seq-item.drop-target { border: 2px dashed var(--primary); }
.seq-item.is-right { border: 2px solid var(--ok); background: var(--ok-soft); }
.seq-item.is-wrong { border: 2px dashed var(--no); }
.seq-pos { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); font-weight: 700; font-size: .9rem; }
.seq-text p { margin: 0; }
.seq-result { font-size: .88rem; margin-top: 6px !important; }
.seq-item.is-right .seq-result .ic { color: var(--ok); }
.seq-item.is-wrong .seq-result .ic { color: var(--no); }
.seq-ctrls { display: flex; flex-direction: column; gap: 6px; }
.btn-txt { font-size: .8rem; }

/* Classification */
.pool, .bin { border: 2px dashed var(--border-strong); border-radius: var(--radius); padding: 12px; background: var(--surface-2); }
.as-list .pool { border: 0; padding: 0; background: none; }
.as-list .pool > .bin-title { display: none; }
.pool.is-empty { padding-bottom: 4px; }
.pool.is-empty .card-list::after { content: "All items sorted. Check your answers below."; display: block; color: var(--muted); font-size: .9rem; padding: 4px; }
.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; }
.bin.over, .pool.over { border-color: var(--primary); background: var(--primary-soft); }
.bin-title { margin: 0 0 4px; font-size: 1rem; }
.bin-desc { font-size: .85rem; color: var(--muted); margin: 0 0 8px; }
.bin-empty { font-size: .85rem; color: var(--muted); margin: 6px 0 0; text-align: center; }
.bin.has-items .bin-empty { display: none; }
.card-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.card-item { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 10px 12px; margin: 0; font-size: .95rem; }
.has-bins .card-item { cursor: grab; }
.card-item.dragging { opacity: .5; }
.card-item.is-right { border: 2px solid var(--ok); }
.card-item.is-wrong { border: 2px dashed var(--no); }
.card-text { display: flex; gap: 10px; }
.card-text p { margin: 0; }
.card-num { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); font-weight: 700; font-size: .85rem; }
.card-ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; font-size: .9rem; }
.card-ctrl label { font-weight: 600; }
.card-fb { margin-top: 8px; font-size: .9rem; }
.card-fb p { margin: 0; }
.card-item.is-right .card-fb .ic { color: var(--ok); }
.card-item.is-wrong .card-fb .ic { color: var(--no); }

/* Matching */
.match { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.def-list, .term-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.def-list li { display: flex; gap: 10px; background: var(--surface-2); border-radius: var(--radius-sm); padding: 8px 12px; margin: 0; }
.def-letter { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: var(--on-primary); font-weight: 700; font-size: .85rem; }
.term-row { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin: 0; display: grid; gap: 6px; }
.term-row label { font-weight: 700; }
.term-row select { width: 100%; }
.term-row.is-right { border: 2px solid var(--ok); }
.term-row.is-wrong { border: 2px dashed var(--no); }
.term-row .card-fb .ic { color: var(--no); }
.term-row.is-right .card-fb .ic { color: var(--ok); }
.match .actions, .match .feedback { margin-top: 0; }

/* Spot the problem */
.spot-paragraph { line-height: 2; background: var(--surface-2); padding: 14px; border-radius: var(--radius-sm); }
.spot-entries { list-style: none; padding: 0; display: grid; gap: 8px; }
.spot-entries li { margin: 0; }
.seg { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 4px; padding: 2px 6px; text-align: left; cursor: pointer; line-height: 1.6; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.spot-entries .seg { display: block; width: 100%; padding: 10px 12px; padding-left: 2.6em; text-indent: -1.4em; }
.spot-entries .seg .seg-tag { text-indent: 0; }
.seg:hover { border-color: var(--primary); }
.seg[aria-pressed="true"] { border: 2px solid var(--primary); background: var(--primary-soft); }
.seg-tag { display: inline-block; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-right: 6px; color: var(--primary-strong); }
.seg-tag:empty { display: none; }
.seg.seg-found { border: 2px solid var(--ok); background: var(--ok-soft); }
.seg.seg-found .seg-tag, .seg.seg-fine .seg-tag { color: var(--ok); }
.seg.seg-missed { border: 2px dashed var(--no); background: var(--no-soft); }
.seg.seg-missed .seg-tag, .seg.seg-false .seg-tag { color: var(--no); }
.seg.seg-false { border: 2px dotted var(--no); }
.seg.seg-fine { border-color: var(--border); }
.spot-count { font-weight: 700; color: var(--text); }

/* Writing activities */
.source-extract { margin: 0 0 16px; background: var(--surface-2); border-radius: var(--radius-sm); padding: 14px 16px; border-left: 4px solid var(--bfc-teal); }
.source-extract figcaption { font-size: .88rem; color: var(--muted); margin-bottom: 8px; }
.source-extract blockquote { margin: 0; font-family: var(--serif); font-size: 1.05rem; }
.source-extract blockquote p { margin: 0; }
.detail-card { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 8px; }
.details { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 16px; margin: 0; }
.details dt { font-size: .8rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.details dd { margin: 0; }
.write-result { margin-top: 14px; display: grid; gap: 12px; }
.model-box, .notes, .selfcheck { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px 16px; }
.model-box p:last-child, .notes ul:last-child, .notes ol:last-child { margin-bottom: 0; }
.checks li.ok .ic { color: var(--ok); }
.checks li.no .ic { color: var(--no); }
mark[data-n] { background: var(--primary-soft); color: inherit; padding: 1px 2px; border-radius: 3px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
mark[data-n]::before { content: attr(data-n); display: inline-grid; place-items: center; min-width: 1.4em; height: 1.4em; margin-right: 4px; border-radius: 50%; background: var(--primary); color: var(--on-primary); font-size: .72rem; font-weight: 700; vertical-align: 2px; }
mark[data-n]:nth-of-type(even) { background: var(--accent-soft); }
.notes-list.numbered li::marker { font-weight: 700; color: var(--primary); }
.check-list { list-style: none; padding: 0; margin: 0; }
.check-list li { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
.check-list input { margin-top: .3em; width: 1.15em; height: 1.15em; flex: none; accent-color: var(--bfc-teal); }

/* Reflection + knowledge check */
.reflect-item { margin-bottom: 16px; }
.reflect-item label { display: block; font-weight: 600; margin-bottom: 6px; }
.kc-q { padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; }
.kc-q legend { float: left; width: 100%; margin-bottom: 10px; }
.kc-q legend + * { clear: both; }
.q-num { display: block; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 2px; }
.kc-q .feedback { margin-top: 4px; }
.kc .opt:has(input:disabled) { cursor: default; }
.kc-result:empty { display: none; }
.pager { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border); }

/* ---------- Workshop ---------- */
.workshop-steps { list-style: none; padding: 0; margin: 0; }
.ws-step h2 { margin-top: 0; }
.q-choice .opt-text strong { display: inline-block; margin-top: 4px; }
.source-cards { list-style: none; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.source-cards li { margin: 0; background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px 14px; border-left: 4px solid var(--bfc-teal); font-size: .95rem; }
.src-cite { font-weight: 700; margin-bottom: .3em; }
.source-cards p:last-child { margin: 0; }
.indicators td, .indicators th { font-size: .92rem; }
.ind { display: inline-flex; gap: 4px; align-items: center; font-weight: 600; white-space: nowrap; }
.ind-good .ind { color: var(--ok); }
.ind-consider .ind { color: var(--mid); }
.ind-info .ind { color: var(--primary); }
.rating { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; margin: 0 0 10px; }
.rating legend { padding: 0 4px; }
.rating legend span { display: block; font-weight: 400; }
.rating-opts { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 6px; }
.rating-opts label { display: inline-flex; gap: 6px; align-items: center; min-height: 36px; }
.rating-opts input { width: 1.1em; height: 1.1em; accent-color: var(--primary); }
.model-para { line-height: 1.9; }

/* ---------- Assessment ---------- */
.aq-q { font-size: 1.2rem; margin: 6px 0 16px; font-family: var(--font); }
.set-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(160px, 220px); gap: 10px 16px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); }
.set-row p { margin: 0; }
.set-row select { width: 100%; }
.q-nav ol { list-style: none; padding: 0; margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.q-nav li { margin: 0; }
.qn { min-width: 40px; min-height: 40px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
.qn.answered { background: var(--primary-soft); border-color: var(--primary); text-decoration: underline; }
.qn[aria-current="step"] { outline: 2px solid var(--primary); outline-offset: 1px; }
.qn-key { display: inline-block; width: 14px; height: 14px; border: 1px solid var(--border-strong); border-radius: 3px; vertical-align: -2px; margin: 0 4px 0 10px; }
.qn-key.answered { background: var(--primary-soft); border-color: var(--primary); margin-left: 0; }
.result-hero { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
.result-hero h2 { margin-top: 0; }
.score-ring { --p: 0; width: 130px; height: 130px; border-radius: 50%; display: grid; place-items: center; flex: none; background: conic-gradient(var(--bfc-teal) calc(var(--p) * 1%), var(--surface-2) 0); }
.score-ring span { display: grid; place-items: center; width: 100px; height: 100px; border-radius: 50%; background: var(--surface); font-size: 1.6rem; font-weight: 700; }
.result-hero > div:last-child { flex: 1; min-width: 240px; }
.score-line { font-size: 1.15rem; }
.recs li { margin-bottom: .7em; }
.review-list { padding-left: 0; list-style: none; }
.review { border: 1px solid var(--border); border-left: 5px solid var(--ok); border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 12px; }
.review.no { border-left-color: var(--no); border-left-style: dashed; }
.rv-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.review.ok .rv-head > .ic { color: var(--ok); }
.review.no .rv-head > .ic { color: var(--no); }
.rv-q { font-weight: 600; }
.rv-explain { color: var(--muted); margin-bottom: 0; }
.inline-check { display: inline-flex; gap: 8px; align-items: center; }
.inline-check input { width: 1.1em; height: 1.1em; }

/* ---------- Glossary ---------- */
.glossary { margin: 0; display: grid; gap: 0; }
.gl-item { padding: 10px 0; border-top: 1px solid var(--border); }
.gl-item dt { font-weight: 700; }
.gl-item dd { margin: 2px 0 0; color: var(--muted); }
dialog { border: 0; padding: 0; border-radius: var(--radius); box-shadow: 0 20px 60px rgba(0,0,0,.35); background: var(--surface); color: var(--text); max-width: min(640px, calc(100vw - 32px)); width: 100%; }
dialog::backdrop { background: rgba(10, 20, 35, .55); }
.dialog-inner { padding: 20px 22px 22px; max-height: 80vh; overflow-y: auto; }
.dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.dialog-head h2 { margin: 0; }
.dialog-inner .input { margin-bottom: 6px; }
#confirm-dialog { max-width: 460px; }

/* ---------- Summary ---------- */
.summary-table td, .summary-table th { white-space: nowrap; }
.summary-table th[scope="row"] { white-space: normal; min-width: 200px; }
.rev-topic { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; margin: 0 0 12px; }
.rev-topic legend { font-weight: 700; padding: 0 4px; }

/* ---------- Motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* ---------- Responsive ---------- */
@media (max-width: 959px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-flex; }
  .sidebar { position: fixed; top: var(--head-h); left: 0; bottom: 0; height: auto; width: min(320px, 86vw); z-index: 35; transform: translateX(-100%); visibility: hidden; transition: transform .25s ease, visibility .25s; box-shadow: 4px 0 24px rgba(0,0,0,.18); }
  body.nav-open .sidebar { transform: none; visibility: visible; }
  body.nav-open .scrim { display: block; position: fixed; inset: var(--head-h) 0 0 0; background: rgba(10, 20, 35, .45); z-index: 30; }
}
@media (max-width: 600px) {
  body { font-size: 1rem; }
  #content { padding: 20px 16px 48px; }
  :root { --head-h: 60px; }
  .brand { gap: 10px; }
  .brand-logo { height: 40px; }
  .brand-divider { display: none; }
  /* Phones show the logo only; the title stays available to screen readers. */

<script>
/* Academic Writing Skills: teaching content, Topics 1-5.
   All named authors, journals, organisations and studies are fictional and illustrative. */

// Inline glossary link: opens the glossary panel filtered to a term.
const G = (text, term) => `<button type="button" class="term" data-term="${term || text}">${text}</button>`;
// Badge marking fictional material.
const ILL = `<span class="badge-ill" title="Fictional example created for this resource">Illustrative</span>`;

const TOPICS = [];

/* ------------------------------------------------------------------ */
TOPICS.push({
  id: 't1', num: 1, time: '30 min',
  title: 'Introduction to Academic Writing',
  short: 'Academic writing',
  summary: 'What academic writing is for, how it differs from everyday communication, and the different kinds of writing your assignments ask for.',
  disciplines: ['Business', 'Cyber Security', 'Education', 'Digital Media'],
  focus: 'academic tone, formal language and the difference between descriptive, analytical, evaluative and critical writing',
  objectives: [
    'Explain the purpose of academic writing and how it differs from everyday communication.',
    'Distinguish between formal and informal language in written examples.',
    'Identify the features of an objective, precise and evidence-based academic tone.',
    'Differentiate between descriptive, analytical, evaluative and critical writing.',
    'Rewrite informal statements in an appropriate academic style.'
  ],
  intro: `
    <p>Academic writing is the way that researchers, lecturers and students communicate ideas, evidence and arguments to one another. At Blackpool and The Fylde College, your written assignments are the main way you demonstrate what you have learned, how well you understand it, and how carefully you can think about it.</p>
    <p>Academic writing is <strong>not</strong> about using long words, complicated sentences or impressive-sounding phrases. Good academic writing is usually clear, precise and carefully reasoned. The aim is to help your reader follow your thinking and judge whether your conclusions are justified by the evidence.</p>
    <p>This topic introduces the main conventions (agreed, expected ways of doing things) that most UK higher education providers share. Later topics look at each of these in more detail.</p>`,
  content: [
    { h: 'The purpose of academic writing', html: `
      <p>Academic writing has several overlapping purposes. In a higher education assignment you are usually expected to:</p>
      <ul>
        <li><strong>demonstrate understanding</strong> of key concepts, theories and debates in your subject;</li>
        <li><strong>construct an argument</strong>: a reasoned position supported by evidence;</li>
        <li><strong>engage with the work of others</strong>, showing how your ideas relate to existing research;</li>
        <li><strong>meet the learning outcomes and assessment criteria</strong> set for the module.</li>
      </ul>
      <p>In research more broadly, academic writing is also how new knowledge is shared, tested and challenged.</p>` },
    { h: 'How academic writing differs from everyday communication', html: `
      <div class="table-wrap"><table>
        <caption>Everyday and academic communication compared</caption>
        <thead><tr><th scope="col">Feature</th><th scope="col">Everyday communication</th><th scope="col">Academic writing</th></tr></thead>
        <tbody>
          <tr><th scope="row">Audience</th><td>Friends, family, colleagues who share your context</td><td>An informed reader who expects ideas to be explained and justified</td></tr>
          <tr><th scope="row">Purpose</th><td>Sharing news, opinions, arrangements</td><td>Explaining, analysing, evaluating and arguing</td></tr>
          <tr><th scope="row">Evidence</th><td>Personal experience or hearsay is often enough</td><td>Claims are supported with credible sources, data or reasoning</td></tr>
          <tr><th scope="row">Tone</th><td>Casual, emotional, conversational</td><td>Measured, objective and cautious where evidence is limited</td></tr>
          <tr><th scope="row">Structure</th><td>Often loose and spontaneous</td><td>Planned, with a clear introduction, logical development and conclusion</td></tr>
          <tr><th scope="row">Language</th><td>Slang, contractions, vague words (&lsquo;stuff&rsquo;, &lsquo;loads&rsquo;)</td><td>Precise vocabulary, full forms, defined terminology</td></tr>
        </tbody>
      </table></div>` },
    { h: 'Formal and informal language', html: `
      <p><strong>Formal</strong> language is the more careful, impersonal style expected in academic work. <strong>Informal</strong> language is the relaxed style of conversation and social media. Common informal features to avoid in most assignments include:</p>
      <ul>
        <li><strong>contractions</strong> such as <em>don't</em>, <em>it's</em>, <em>can't</em> (write <em>do not</em>, <em>it is</em>, <em>cannot</em>);</li>
        <li><strong>slang and colloquialisms</strong> such as <em>loads of</em>, <em>a bit</em>, <em>gonna</em>, <em>kind of</em>;</li>
        <li><strong>emotive or exaggerated words</strong> such as <em>amazing</em>, <em>terrible</em>, <em>massive</em>;</li>
        <li><strong>rhetorical questions</strong> that the writer does not go on to answer;</li>
        <li><strong>exclamation marks</strong> used for emphasis.</li>
      </ul>
      <p>Formal does not mean complicated. <em>&lsquo;The results suggest that&hellip;&rsquo;</em> is formal and simple. <em>&lsquo;It would appear to be the case that the results are suggestive of&hellip;&rsquo;</em> is formal but unnecessarily wordy.</p>` },
    { h: 'Academic tone and objectivity', html: `
      <p><strong>Tone</strong> is the attitude your writing conveys. An academic tone is measured and respectful, even when you disagree with a source. <strong>Objectivity</strong> means basing your judgements on evidence and reasoning rather than on personal feelings or preferences.</p>
      <p>Objectivity does <em>not</em> mean you cannot take a position. Strong assignments often argue a clear position, but that position is reached by weighing the evidence, and the reader can see why you reached it.</p>
      <div class="callout"><p><strong>Disciplinary note:</strong> some assignments, such as reflective accounts, placement logs or practice-based Education and Digital Media projects, explicitly invite personal perspective. Even then, reflections are usually connected to theory or evidence. Always follow your assignment brief.</p></div>` },
    { h: 'Clarity, accuracy and precision', html: `
      <ul>
        <li><strong>Clarity</strong>: the reader can understand your point on first reading. Use one main idea per sentence where possible.</li>
        <li><strong>Accuracy</strong>: facts, figures, names and source details are correct, and you represent other authors' views fairly.</li>
        <li><strong>Precision</strong>: you choose the exact word or figure rather than a vague approximation. <em>&lsquo;A lot of companies&rsquo;</em> becomes <em>&lsquo;approximately 40% of UK small businesses surveyed&rsquo;</em>.</li>
      </ul>` },
    { h: 'Evidence-based arguments', html: `
      <p>An <strong>assertion</strong> is a statement presented as true without support. An <strong>argument</strong> is a position supported by reasons and evidence. Academic writing relies on arguments. Evidence might come from published research, data you have collected, case studies, professional standards or carefully explained reasoning. Topics 5 and 8 develop this in detail.</p>` },
    { h: 'Writing for an academic audience', html: `
      <p>A useful way to picture your reader is as an <strong>intelligent, informed person who is not inside your head</strong>. They know your general subject but cannot guess what you mean, so you need to define key terms, explain your reasoning and show where your evidence comes from. Your marker wants to see your understanding on the page; do not assume they will &lsquo;fill in the gaps&rsquo;.</p>` },
    { h: 'Descriptive, analytical, evaluative and critical writing', html: `
      <p>Assignments ask for different kinds of thinking. These are often described as a progression, although good writing usually combines them:</p>
      <div class="table-wrap"><table>
        <caption>Four kinds of academic writing</caption>
        <thead><tr><th scope="col">Type</th><th scope="col">Main question</th><th scope="col">What it does</th></tr></thead>
        <tbody>
          <tr><th scope="row">Descriptive</th><td>What? Who? When?</td><td>Reports facts, summarises information or sets out background.</td></tr>
          <tr><th scope="row">Analytical</th><td>How? Why?</td><td>Breaks information into parts and explains relationships, causes and patterns.</td></tr>
          <tr><th scope="row">Evaluative</th><td>How well? How useful?</td><td>Judges strengths, weaknesses, reliability or effectiveness against criteria.</td></tr>
          <tr><th scope="row">Critical</th><td>So what? What follows?</td><td>Weighs evidence and perspectives to reach and justify a position, considering implications.</td></tr>
        </tbody>
      </table></div>
      <p>Description is still necessary (you cannot analyse something your reader does not understand), but it should support your argument rather than replace it. As a broad guide, Level 4 work introduces analysis, Level 5 work develops analysis and evaluation, and Level 6 work is expected to be consistently critical. Topic 4 explores this further.</p>` }
  ],
  examples: [
    { title: 'Making a claim more academic', disc: 'Business',
      weak: 'Loads of companies are using social media these days and it\'s really good for them.',
      strong: 'Many small and medium-sized enterprises now use social media for marketing, and there is evidence that this can increase customer engagement (Patel, Morgan and Clarke, 2022).',
      why: 'The revised version replaces vague, informal words (<em>loads</em>, <em>these days</em>, <em>really good</em>) with precise terms, removes the contraction, softens the claim (<em>can increase</em>) and supports it with a citation.' },
    { title: 'Avoiding exaggeration', disc: 'Cyber Security',
      weak: 'Hackers can easily get into most systems, which is a massive problem!',
      strong: 'Systems that rely on default passwords or unpatched software are particularly vulnerable to unauthorised access, which presents a significant risk to organisations (Okafor, 2024).',
      why: 'The academic version specifies <em>which</em> systems are at risk and why, replaces emotive language (<em>massive</em>, the exclamation mark) with a measured judgement, and provides evidence.' },
    { title: 'From personal opinion to justified position', disc: 'Education',
      weak: 'I think teachers should obviously use more technology because kids love it.',
      strong: 'There is some evidence that carefully planned use of digital technology can support pupil engagement (Hughes, 2021); however, its effectiveness appears to depend on how it is integrated into teaching.',
      why: '<em>I think</em> and <em>obviously</em> present opinion as if it were fact. The revision bases the claim on evidence, uses cautious language and recognises a limitation, which makes the argument more persuasive.' }
  ],
  more: [
    { title: 'Is academic writing the same in every subject?', html: `<p>No. Core principles are shared, but conventions vary. Computing and Cyber Security students often write technical reports with numbered sections, while Education students may write reflective essays. Some sciences favour the passive voice (<em>&lsquo;the data were collected&rsquo;</em>), while many humanities and social science disciplines accept careful use of <em>I</em>. Look at examples of good work in your discipline and follow your module guidance.</p>` },
    { title: 'Common myths about academic writing', html: `<ul><li><strong>&lsquo;Longer words sound more academic.&rsquo;</strong> Clear, precise words are more effective.</li><li><strong>&lsquo;You must never use I.&rsquo;</strong> This depends on the discipline and the assignment.</li><li><strong>&lsquo;Academic writing has no opinions.&rsquo;</strong> It contains justified positions rather than unsupported opinions.</li><li><strong>&lsquo;More references always means a better grade.&rsquo;</strong> How well you use sources matters more than how many you list.</li></ul>` },
    { title: 'What markers typically look for at Levels 4, 5 and 6', html: `<ul><li><strong>Level 4:</strong> accurate understanding of key ideas, appropriate sources, a clear structure, and the beginnings of analysis.</li><li><strong>Level 5:</strong> developed analysis, comparison of sources and evaluation of evidence.</li><li><strong>Level 6:</strong> sustained critical argument, synthesis of a wide range of sources, independent judgement and awareness of limitations.</li></ul><p>These are general tendencies; your module's assessment criteria are the definitive guide.</p>` }
  ],
  activities: [
    { type: 'choice', title: 'Make it academic',
      instructions: '<p>Each statement below is written in an informal, everyday style. Choose the most appropriate academic alternative, then check your answer. You can also write your own version and compare it with a model.</p>',
      items: [
        { prompt: '<p class="quote-box">&lsquo;Social media is basically ruining young people\'s mental health.&rsquo;</p>', own: true,
          parts: [{ kind: 'single', legend: 'Which version is most appropriate for an academic assignment?', options: [
            { t: 'Several studies have reported an association between heavy social media use and lower wellbeing among adolescents, although the direction of this relationship remains debated (Rahman, 2024).', ok: true, fb: 'This version is precise (<em>heavy</em> use, <em>adolescents</em>), cautious (<em>association</em>, <em>remains debated</em>) and supported by a citation.' },
            { t: 'Social media is having a really damaging effect on the mental health of young people today.', fb: 'This is more formal, but <em>really damaging</em> is an intensified, emotive judgement and the claim is not supported by evidence.' },
            { t: 'It is a well-known fact that social media is destroying young people\'s mental health.', fb: '<em>Well-known fact</em> presents a contested claim as certain, and <em>destroying</em> is emotive. Academic writing avoids overstating what the evidence shows.' } ] }] },
        { prompt: '<p class="quote-box">&lsquo;Loads of businesses went bust because of Covid.&rsquo;</p>', own: true,
          parts: [{ kind: 'single', legend: 'Which version is most appropriate for an academic assignment?', options: [
            { t: 'Lots of businesses closed down because of the Covid pandemic.', fb: '<em>Lots of</em> is informal and vague. The sentence does not specify which businesses or provide evidence.' },
            { t: 'A substantial number of small businesses ceased trading during the COVID-19 pandemic, particularly in the hospitality and retail sectors (Bennett, 2022).', ok: true, fb: 'This version uses precise terms (<em>ceased trading</em>, <em>COVID-19</em>), identifies the sectors affected and cites a source.' },
            { t: 'An unbelievable number of firms collapsed because of the pandemic.', fb: '<em>Unbelievable</em> is emotive and imprecise. A reader would ask: how many, and according to whom?' } ] }] },
        { prompt: '<p class="quote-box">&lsquo;AI is gonna change everything in programming.&rsquo;</p>', own: true,
          parts: [{ kind: 'single', legend: 'Which version is most appropriate for an academic assignment?', options: [
            { t: 'AI will definitely transform every aspect of computer programming.', fb: '<em>Definitely</em> and <em>every aspect</em> overclaim. No source can show this with certainty, so the claim is easy to challenge.' },
            { t: 'It\'s obvious that AI is going to change programming a lot.', fb: 'This contains a contraction (<em>it\'s</em>), presents opinion as obvious, and uses the vague phrase <em>a lot</em>.' },

TOPICS.push({

  title: 'Structuring Academic Work',

  intro: `
    <p>Even excellent ideas can be hard to follow if they are poorly organised. Structure is how you guide your reader through your thinking: what you will cover, in what order, and why each part matters.</p>

  content: [
    { h: 'Introductions', html: `
      <p>An introduction prepares the reader for what follows. It typically:</p>

    { h: 'Purpose and scope', html: `
      <p>The <strong>purpose</strong> is what your assignment sets out to do (for example, to evaluate, compare or recommend). The <strong>${G('scope', 'Scope')}</strong> is the boundary of what you cover: a particular sector, time period, country, group of users or type of technology.</p>

    { h: 'Main bodies', html: `
      <p>The main body develops your argument through a series of paragraphs or sections. Each paragraph should do one job. Common ways to organise the main body include:</p>

    { h: 'Conclusions', html: `

    { h: 'Essays and reports', html: `

    { h: 'Writing effective academic paragraphs', html: `
      <p>An academic paragraph usually develops <strong>one main idea</strong>. A well-developed paragraph commonly contains:</p>

    { h: 'Linking paragraphs and maintaining a logical argument', html: `

TOPICS.push({
  id: 't3', num: 3, time: '35 min',
  title: 'Formal Academic Language',
  short: 'Formal language',
  summary: 'Choosing precise academic vocabulary, avoiding conversational expressions and generalisations, using hedging, and knowing when first-person writing is appropriate.',

  focus: 'precise vocabulary, avoiding generalisations and repetition, hedging, and appropriate use of first person',

    'Judge when first-person writing is appropriate in an assignment.',

  ],
  intro: `
    <p>Language choices shape how credible your writing appears. The same idea can sound casual and unsupported, or careful and authoritative, depending on the words you choose.</p>
    <p>This topic is not about memorising &lsquo;banned&rsquo; words. It is about understanding <em>why</em> certain choices are more effective in academic contexts, so that you can make good decisions in any assignment.</p>`,
  content: [
    { h: 'Appropriate academic vocabulary', html: `
      <p>Academic vocabulary is precise rather than obscure. Many effective academic words are common verbs used carefully:</p>
      <div class="table-wrap"><table>
        <caption>Everyday words and more precise academic alternatives</caption>
        <thead><tr><th scope="col">Everyday</th><th scope="col">More precise alternatives (depending on meaning)</th></tr></thead>
        <tbody>
          <tr><td>look at</td><td>examine, investigate, analyse, consider</td></tr>
          <tr><td>show</td><td>demonstrate, indicate, illustrate, reveal</td></tr>
          <tr><td>get</td><td>obtain, acquire, achieve, receive</td></tr>
          <tr><td>big / huge</td><td>substantial, significant, extensive, considerable</td></tr>
          <tr><td>go up / go down</td><td>increase, rise / decrease, decline</td></tr>
          <tr><td>find out</td><td>identify, establish, determine, discover</td></tr>
        </tbody>
      </table></div>
      <p>Use a thesaurus carefully: synonyms rarely mean exactly the same thing. <em>Significant</em>, for example, has a specific statistical meaning in quantitative research.</p>` },
    { h: 'Avoiding conversational expressions and slang', html: `
      <ul>
        <li><strong>Contractions:</strong> <em>doesn't → does not</em>; <em>it's → it is</em>. (Note that <em>the company's</em> is a possessive, not a contraction, and is acceptable.)</li>
        <li><strong>Fillers and intensifiers:</strong> <em>basically</em>, <em>really</em>, <em>very</em>, <em>totally</em>, <em>literally</em> usually add nothing.</li>
        <li><strong>Colloquialisms:</strong> <em>a bit</em>, <em>kind of</em>, <em>loads of</em>, <em>pretty good</em>, <em>and so on</em>.</li>
        <li><strong>Phrasal verbs:</strong> many are acceptable, but single-word alternatives are often more precise (<em>set up → establish</em>; <em>cut down on → reduce</em>).</li>
        <li><strong>Direct address:</strong> <em>you</em> (&lsquo;You can see that&hellip;&rsquo;) is usually replaced with an impersonal construction (&lsquo;This indicates that&hellip;&rsquo;).</li>
      </ul>` },
    { h: 'Replacing vague statements with precise language', html: `
      <p>Vague words force the reader to guess. Replace them with the specific information you mean:</p>
      <ul>
        <li><em>things / stuff / aspects</em> → name the factors (cost, latency, user trust);</li>
        <li><em>a lot / many / some</em> → give a figure or proportion where available;</li>
        <li><em>nowadays / recently</em> → give a time frame (since 2020; in the last decade);</li>
        <li><em>good / bad</em> → state the criterion (cost-effective, insecure, inaccessible).</li>
      </ul>` },
    { h: 'Avoiding unsupported generalisations', html: `
      <p>A ${G('generalisation')} is a broad claim about a whole group. Words such as <em>all, every, always, never, everyone, nobody</em> and <em>proves</em> make claims that are very hard to support. Narrow the claim to what the evidence shows, or qualify it (<em>many, most, often, in this sample</em>).</p>` },
    { h: 'Removing unnecessary repetition and wordiness', html: `
      <div class="table-wrap"><table>
        <caption>Wordy phrases and concise alternatives</caption>
        <thead><tr><th scope="col">Wordy</th><th scope="col">Concise</th></tr></thead>
        <tbody>
          <tr><td>due to the fact that</td><td>because</td></tr>
          <tr><td>in order to</td><td>to</td></tr>
          <tr><td>at this moment in time</td><td>now / currently</td></tr>
          <tr><td>in my own personal opinion</td><td>(remove, or use a justified claim)</td></tr>
          <tr><td>a large number of</td><td>many (or a specific figure)</td></tr>
          <tr><td>it is important to note that</td><td>(often unnecessary; state the point)</td></tr>
        </tbody>
      </table></div>
      <p>Repeating the same noun several times in one sentence is also distracting. Use pronouns, or restructure the sentence.</p>` },
    { h: 'First-person and third-person writing', html: `
      <p><strong>Third-person</strong> writing (<em>this essay argues</em>; <em>the evidence suggests</em>) keeps attention on ideas and evidence and is common in many assignments. <strong>First-person</strong> writing (<em>I</em>, <em>we</em>) is appropriate in many contexts, including:</p>
      <ul>
        <li><strong>reflective assignments</strong>, such as placement journals, learning logs and professional development portfolios;</li>
        <li>describing <strong>your own methods</strong> in some disciplines (&lsquo;I interviewed six teachers&hellip;&rsquo;);</li>
        <li>assignments where the <strong>assessment guidance permits or expects it</strong>.</li>
      </ul>
      <p>What is usually discouraged is using <em>I think</em> or <em>I feel</em> as a <em>substitute</em> for evidence. &lsquo;I argue that&hellip;, because&hellip;&rsquo; is very different from &lsquo;I feel that&hellip;&rsquo;. Always check your brief and module guidance.</p>` },
    { h: 'Hedging and cautious academic claims', html: `
      <p>${G('Hedging', 'Hedging')} means expressing the appropriate degree of certainty. Because research evidence is rarely conclusive, academic writers often signal caution:</p>
      <ul>
        <li><strong>modal verbs:</strong> may, might, could;</li>
        <li><strong>cautious verbs:</strong> suggests, indicates, appears, tends to;</li>
        <li><strong>qualifiers:</strong> often, in some cases, generally, it is likely that.</li>
      </ul>
      <p>Hedging should match the evidence. Over-hedging (&lsquo;it could perhaps possibly be suggested that&hellip;&rsquo;) weakens your argument. When evidence is strong, confident language (<em>demonstrates</em>, <em>clearly shows</em>) is appropriate.</p>` },

      <p>Descriptive writing reports information: what something is, what happened, who said what. It answers questions such as <em>what?</em>, <em>when?</em> and <em>who?</em> It is necessary for:</p>

/* Academic Writing Skills: teaching content, Topics 6-10.
   All named authors, journals, organisations and studies are fictional and illustrative. */

const TURNER_EXTRACT = `
  <figure class="source-extract">
    <figcaption><strong>Source extract</strong> ${ILL}<br>Turner, A. (2023) &lsquo;Digital exclusion and online learning&rsquo;, <i>Journal of Educational Technology Studies</i>, 14(2), pp. 45-61. (Extract from p. 52.)</figcaption>
    <blockquote><p>&ldquo;Although online learning is often promoted as a way of widening access to education, students without reliable internet connections or suitable devices may find themselves further disadvantaged. For these learners, the move to digital provision can reinforce, rather than reduce, existing educational inequalities.&rdquo;</p></blockquote>
  </figure>`;

const PARA_REASONS = [
  { t: 'Meaning preserved in the writer\'s own words and structure, with a citation' },
  { t: 'Follows the original wording and structure too closely (patchwriting)' },
  { t: 'Uses the author\'s ideas or words without proper acknowledgement' },
  { t: 'Changes or distorts the author\'s meaning' },
  { t: 'A correctly marked and cited direct quotation' }
];
function reasons(okIndex, fbs) { return PARA_REASONS.map((r, i) => ({ t: r.t, ok: i === okIndex, fb: fbs[i] || '' })); }
function verdict(acceptable, fbOk, fbNo) {
  return [{ t: 'Acceptable', ok: acceptable, fb: acceptable ? fbOk : fbNo }, { t: 'Not acceptable', ok: !acceptable, fb: acceptable ? fbNo : fbOk }];
}
