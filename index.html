TOPICS.push({
  id: 't8', num: 8, time: '40 min',
  title: 'Developing Academic Arguments',
  short: 'Arguments',
  summary: 'Building a clear central argument, distinguishing claims, evidence and reasoning, engaging with alternative perspectives and avoiding logical weaknesses.',
  disciplines: ['Business', 'Computing', 'Education'],
  focus: 'central arguments, claims, evidence and reasoning, counter-arguments and avoiding logical weaknesses',
  objectives: [
    'Formulate a clear central argument in response to an assignment question.',
    'Distinguish between claims, evidence and reasoning in an argument.',
    'Incorporate and respond to alternative perspectives.',
    'Explain the significance of evidence in relation to a claim.',
    'Identify common logical weaknesses and unsupported claims.',
    'Draw conclusions that are justified by the evidence presented.'
  ],
  intro: `
    <p>In academic writing, an <strong>argument</strong> is not a dispute. It is a reasoned case for a position, built from claims supported by evidence and connected by clear reasoning.</p>
    <p>Most higher education assignments (essays, reports, dissertations and even many reflective pieces) are judged partly on the quality of their argument. A strong argument answers the question, is supported by evidence, considers alternatives and reaches a justified conclusion.</p>`,
  content: [
    { h: 'Formulating a central argument', html: `
      <p>Your <strong>central argument</strong> (or ${G('thesis statement')}) is your overall answer to the question. It should be:</p>
      <ul>
        <li><strong>clear</strong>: a reader can state it in one or two sentences;</li>
        <li><strong>arguable</strong>: a reasonable person could disagree with it;</li>
        <li><strong>specific</strong>: it addresses the question directly and sets out your position and its limits.</li>
      </ul>
      <p class="example-line"><em>Weak:</em> &lsquo;This essay will discuss the advantages and disadvantages of a four-day week.&rsquo; <br><em>Stronger:</em> &lsquo;This essay argues that a four-day week is viable for knowledge-based organisations where output can be measured, but is unlikely to suit services requiring continuous staffing.&rsquo;</p>` },
    { h: 'Claims, evidence and reasoning', html: `
      <div class="table-wrap"><table>
        <caption>The building blocks of an argument</caption>
        <thead><tr><th scope="col">Element</th><th scope="col">What it is</th><th scope="col">Example</th></tr></thead>
        <tbody>
          <tr><th scope="row">${G('Claim')}</th><td>A statement you want the reader to accept</td><td>Low-stakes quizzing can improve pupils' recall.</td></tr>
          <tr><th scope="row">${G('Evidence')}</th><td>Information that supports the claim</td><td>Hughes (2021) found improved recall in twelve secondary schools after a term of weekly quizzes.</td></tr>
          <tr><th scope="row">Reasoning (interpretation)</th><td>The explanation of how the evidence supports the claim and why it matters</td><td>This suggests that regular retrieval practice strengthens memory, which is particularly valuable before examinations.</td></tr>
        </tbody>
      </table></div>
      <p>Evidence does not speak for itself. Many weak arguments present evidence without reasoning, leaving the reader to work out its relevance.</p>` },
    { h: 'Considering alternative perspectives', html: `
      <p>A ${G('counter-argument')} is a view or piece of evidence that challenges your position. Engaging with it strengthens your argument. You can:</p>
      <ul>
        <li><strong>concede</strong> that it has some force but explain why your position still holds;</li>
        <li><strong>refute</strong> it by showing weaknesses in its evidence or reasoning;</li>
        <li><strong>qualify</strong> your claim in response (for example, limiting it to particular contexts).</li>
      </ul>
      <p>Useful language: <em>Critics argue that&hellip;; While this has some merit&hellip;; However, this view overlooks&hellip;</em></p>` },
    { h: 'Explaining the significance of evidence', html: `
      <p>After presenting evidence, ask &lsquo;so what?&rsquo;. Explain what it shows, how strong it is and how it relates to the question. Phrases such as <em>this indicates&hellip;</em>, <em>this is significant because&hellip;</em> and <em>this supports the view that&hellip;</em> help you make your reasoning visible.</p>` },
    { h: 'Connecting your argument to the assignment question', html: `
      <p>${G('Command words', 'Command word')} in a question tell you what kind of argument is expected:</p>
      <div class="table-wrap"><table>
        <caption>Common command words</caption>
        <thead><tr><th scope="col">Command word</th><th scope="col">What it usually asks you to do</th></tr></thead>
        <tbody>
          <tr><th scope="row">Analyse</th><td>Examine in detail, identifying parts, relationships and causes.</td></tr>
          <tr><th scope="row">Discuss</th><td>Consider different perspectives and reach a reasoned view.</td></tr>
          <tr><th scope="row">Evaluate / Assess</th><td>Judge value, effectiveness or significance, using evidence and criteria.</td></tr>
          <tr><th scope="row">Critically evaluate</th><td>Make a detailed, balanced judgement that considers strengths, limitations and alternative views.</td></tr>
          <tr><th scope="row">To what extent</th><td>Decide how far something is true, acknowledging where it is and is not.</td></tr>
          <tr><th scope="row">Compare and contrast</th><td>Identify similarities and differences, and explain their significance.</td></tr>
        </tbody>
      </table></div>
      <p>Return to the question regularly. A useful test for each paragraph is: &lsquo;How does this help answer the question?&rsquo;</p>` },
    { h: 'Drawing justified conclusions', html: `
      <p>Conclusions should be proportionate to the evidence. If your evidence comes from a small sample in one sector, a conclusion about &lsquo;all organisations&rsquo; is not justified. Acknowledging limits (<em>within the context of UK SMEs&hellip;</em>) makes conclusions more credible, not less.</p>` },
    { h: 'Avoiding unsupported claims and logical inconsistencies', html: `
      <ul>
        <li><strong>Overgeneralisation:</strong> drawing a broad conclusion from limited evidence.</li>
        <li><strong>Correlation treated as causation:</strong> assuming that because two things occur together, one caused the other.</li>
        <li><strong>Circular reasoning:</strong> the conclusion simply restates the premise (&lsquo;X is ineffective because it does not work&rsquo;).</li>
        <li><strong>False dilemma:</strong> presenting only two options when others exist.</li>
        <li><strong>Appeal to popularity or common belief:</strong> &lsquo;everyone knows&hellip;&rsquo;.</li>
        <li><strong>Cherry-picking:</strong> selecting only the evidence that supports your view.</li>
        <li><strong>Internal contradiction:</strong> claims in different sections that conflict.</li>
      </ul>` }
  ],
  examples: [
    { title: 'Evidence with and without reasoning', disc: 'Education',
      weak: 'Low-stakes quizzing is effective. Hughes (2021) studied twelve schools. Pupils did better.',
      strong: 'Low-stakes quizzing appears to improve pupils\' recall of factual knowledge. Hughes (2021) found that pupils in twelve secondary schools recalled more key content after a term of weekly quizzes than a comparison group. This suggests that regular retrieval practice strengthens memory; however, because the study measured recall rather than understanding, it is less clear whether quizzing supports deeper learning.',
      why: 'The stronger version explains what the evidence shows, why it supports the claim and where its limits lie.' },
    { title: 'Engaging with a counter-argument', disc: 'Computing',
      weak: 'Open-source software is better than proprietary software. Some people say it is less secure but that is wrong.',
      strong: 'Open-source software can offer organisations greater flexibility and lower licensing costs. Critics argue that publicly available code makes vulnerabilities easier to find; however, the same openness allows a wider community to identify and fix flaws. Security therefore appears to depend less on whether code is open than on how actively a project is maintained.',
      why: 'The stronger version represents the counter-argument fairly, responds with reasoning and reaches a more nuanced, defensible position.' }
  ],
  more: [
    { title: 'Planning an argument: a simple map', html: `<ol><li>Write the question at the top of a page.</li><li>Write your one-sentence answer (central argument).</li><li>List three to five supporting claims.</li><li>Under each claim, note the evidence and your reasoning.</li><li>Note the strongest counter-argument and your response.</li><li>Write the conclusion your map justifies.</li></ol>` },
    { title: 'Using "I argue" or "this essay argues"', html: `<p>Stating your position explicitly in the introduction and conclusion helps markers follow your argument. Whether to write &lsquo;I argue&rsquo; or &lsquo;this essay argues&rsquo; depends on disciplinary convention and guidance (see Topic 3).</p>` }
  ],
  activities: [
    { type: 'classify', title: 'Identify the parts of an argument', layout: 'list',
      instructions: '<p>The paragraph below responds to the question <em>&lsquo;Should UK organisations adopt a four-day working week?&rsquo;</em> For each sentence, select the role it plays in the argument.</p>',
      categories: [
        { id: 'claim', label: 'Claim' }, { id: 'evidence', label: 'Evidence' }, { id: 'reasoning', label: 'Reasoning' },
        { id: 'counter', label: 'Counter-argument' }, { id: 'conclusion', label: 'Conclusion' } ],
      ordered: true,
      items: [
        { t: 'A four-day working week can improve productivity in some organisations, but it is not suitable for every sector.', cat: 'claim', fb: 'This states the position that the rest of the paragraph supports.' },
        { t: 'In an illustrative pilot involving 40 UK firms, Ellis and Grant (2024) reported that most participating organisations maintained their previous output while reducing working hours by 20%.', cat: 'evidence', fb: 'This presents findings from a source to support the claim.' },
        { t: 'This suggests that a shorter week may encourage employees to prioritise high-value tasks and reduce time spent on less productive activities, such as unnecessary meetings.', cat: 'reasoning', fb: 'This interprets the evidence and explains how it supports the claim.' },
        { t: 'However, critics argue that such pilots attract organisations that are already well suited to flexible working, which may inflate the reported benefits (Hart, 2025).', cat: 'counter', fb: 'This introduces an alternative perspective that challenges the evidence.' },
        { t: 'This criticism is significant, because services that must be staffed continuously, such as healthcare, cannot easily compress working hours without recruiting additional staff.', cat: 'reasoning', fb: 'This evaluates the counter-argument and explains why it matters: reasoning that develops the qualification in the claim.' },
        { t: 'Therefore, a four-day week appears most viable in knowledge-based roles where output can be measured, rather than as a universal policy.', cat: 'conclusion', fb: 'This draws a qualified conclusion that follows from the evidence and reasoning.' }
      ] },
    { type: 'spot', title: 'Find the weaknesses', display: 'paragraph',
      instructions: '<p>This paragraph argues that businesses should invest in social media marketing. Select each sentence that contains a logical weakness or unsupported claim, then check your answers.</p>',
      segments: [
        { t: 'Everyone knows that social media marketing is the most effective form of advertising.', issue: '<strong>Appeal to common belief and overgeneralisation.</strong> &lsquo;Everyone knows&rsquo; is not evidence, and &lsquo;the most effective&rsquo; is an absolute claim.' },
        { t: 'Company X increased its social media spending in 2022, and its sales rose in 2023, which proves that social media marketing caused the increase.', issue: '<strong>Correlation treated as causation.</strong> Sales may have risen for other reasons; one case cannot <em>prove</em> causation.' },
        { t: 'Several studies have found that social media campaigns can increase brand awareness among younger consumers (Patel, Morgan and Clarke, 2022).' },
        { t: 'Either businesses invest heavily in social media or they will fail.', issue: '<strong>False dilemma.</strong> Many other options and outcomes exist.' },
        { t: 'Traditional advertising is outdated because it is no longer modern.', issue: '<strong>Circular reasoning.</strong> &lsquo;Outdated&rsquo; and &lsquo;no longer modern&rsquo; mean the same thing, so no reason is given.' },
        { t: 'Nevertheless, the effectiveness of social media marketing is likely to depend on the target audience and the type of product.' }
      ],
      explain: '<p>The two sentences without major problems are the cited, cautiously worded claim about brand awareness and the final qualification. Notice that the final sentence actually contradicts the confident tone of the opening, an internal inconsistency that a revised argument should resolve.</p>' },
    { type: 'write', title: 'Improve the argument', rows: 8,
      instructions: '<p>Rewrite the social media paragraph as a stronger academic argument. Keep the useful evidence, remove the logical weaknesses, add reasoning and reach a justified conclusion. Then compare your version with the model.</p>',
      label: 'Your improved paragraph',
      model: '<p>Social media marketing can be an effective way for businesses to reach younger consumers. Several studies have found that social media campaigns can increase brand awareness among this group (Patel, Morgan and Clarke, 2022), possibly because platforms allow highly targeted and interactive content. However, increased awareness does not necessarily lead to increased sales, and a single company\'s experience cannot establish a causal link between social media spending and revenue. Furthermore, traditional channels may remain more effective for older audiences or for products that are rarely researched online. Social media marketing is therefore best regarded as one element of a wider strategy, with its value depending on the target audience and the type of product.</p>',
      notes: ['Opens with a qualified claim rather than an absolute one.', 'Keeps the cited evidence and adds reasoning (<em>possibly because&hellip;</em>).', 'Recognises the limits of the evidence (awareness is not sales; one case is not proof).', 'Replaces the false dilemma with a balanced consideration of alternatives.', 'Ends with a justified, proportionate conclusion that resolves the earlier inconsistency.'] }
  ],
  reflection: [
    'Write the central argument for a current assignment in one sentence. Is it clear, arguable and specific?',
    'What is the strongest counter-argument to your position, and how will you respond to it?'
  ],
  check: [
    { q: '"Students who use the library more achieve higher grades, so using the library causes higher grades." What is the main weakness?', options: [
      'Circular reasoning', 'Correlation treated as causation', 'Appeal to authority', 'Over-hedging'], answer: 1,
      explain: 'Other factors (such as motivation) could explain both behaviours. A relationship between two variables does not show that one causes the other.' },
    { q: 'Which is the best central argument for "To what extent is cloud computing cost-effective for SMEs?"', options: [
      'This essay will look at cloud computing.',
      'Cloud computing is a popular technology.',
      'Cloud computing can be cost-effective for SMEs with predictable workloads, but hidden costs such as data egress and skills gaps reduce savings for others.',
      'Cloud computing is always cost-effective.'], answer: 2,
      explain: 'The third option answers "to what extent" directly, is arguable and specifies the conditions under which the claim holds.' },
    { q: 'What is the role of reasoning in an argument?', options: [
      'To list as many sources as possible.',
      'To explain how the evidence supports the claim and why it matters.',
      'To repeat the claim in different words.',
      'To introduce the topic.'], answer: 1,
      explain: 'Reasoning connects evidence to claims. Without it, the reader must guess why the evidence is relevant.' },
    { q: 'Why should you include counter-arguments in an academic argument?', options: [
      'To show that you are unsure of your position.',
      'Because markers require exactly one counter-argument per essay.',
      'To show you have considered alternative views and to strengthen your position by responding to them.',
      'To increase the word count.'], answer: 2,
      explain: 'Engaging fairly with alternatives shows critical thinking and makes your conclusion more convincing.' }
  ],
  keyPoints: [
    'State a clear, arguable, specific central argument that answers the question.',
    'Support claims with evidence and make your reasoning explicit.',
    'Engage fairly with counter-arguments: concede, refute or qualify.',
    'Avoid logical weaknesses such as overgeneralisation and confusing correlation with causation.'
  ]
});

TOPICS.push({
  id: 't9', num: 9, time: '40 min',
  title: 'Academic Integrity and Responsible Use of AI',
  short: 'Integrity and AI',
  summary: 'Academic honesty, plagiarism, collusion and acknowledgement, and how generative AI can be used responsibly within Blackpool and The Fylde College\'s rules.',
  disciplines: ['All disciplines'],
  focus: 'academic integrity, collusion, and responsible, transparent use of generative AI within assessment rules',
  objectives: [
    'Explain the principles of academic integrity and why they matter.',
    'Distinguish between poor academic practice and academic misconduct.',
    'Differentiate between legitimate collaboration and collusion.',
    'Identify ways in which generative AI can support learning responsibly.',
    'Evaluate the risks of AI-generated information, including fabricated references.',
    'Determine whether AI use in a scenario is appropriate, inappropriate or dependent on assessment guidance.'
  ],
  intro: `
    <p><strong>${G('Academic integrity')}</strong> means acting honestly and responsibly in your learning, research and assessment. It underpins the value of your qualification: a degree certifies that the work you submitted demonstrates your own knowledge and skills.</p>
    <p>Generative artificial intelligence (AI) has created new opportunities and new questions. This topic does <strong>not</strong> assume that all AI use is misconduct. Whether a particular use is acceptable depends on Blackpool and The Fylde College's regulations and on the specific requirements of each assessment.</p>`,
  content: [
    { h: 'Academic honesty and integrity', html: `
      <p>Academic integrity is often described in terms of shared values such as <strong>honesty, trust, fairness, respect and responsibility</strong>. In practice, this means:</p>
      <ul>
        <li>submitting work that genuinely represents your own learning;</li>
        <li>acknowledging the ideas, words and assistance of others;</li>
        <li>reporting data and findings truthfully;</li>
        <li>following the rules set for each assessment.</li>
      </ul>` },
    { h: 'Plagiarism and poor academic practice', html: `
      <p>Plagiarism is presenting someone else's work or ideas as your own (see Topic 6). Higher education providers often distinguish between:</p>
      <ul>
        <li><strong>poor academic practice</strong>: minor errors, such as inconsistent referencing or some patchwriting, often treated as a learning issue, especially early in a course;</li>
        <li><strong>academic misconduct</strong>: more serious breaches, such as substantial copying, submitting work produced by others, fabricating data or collusion.</li>
      </ul>
      <p>Other forms of misconduct include <strong>self-plagiarism</strong> (resubmitting your own previously assessed work without permission), <strong>contract cheating</strong> (paying or arranging for someone else to complete work) and <strong>fabrication</strong> of data or sources. Definitions and penalties vary between institutions.</p>` },
    { h: 'Collusion and inappropriate collaboration', html: `
      <p>Collaboration is valuable: discussing ideas, studying together and giving each other general feedback are encouraged in many courses. ${G('Collusion')} occurs when students work together on an <strong>individual</strong> assessment in ways that are not permitted, for example by sharing written answers, writing sections together or copying each other's code.</p>
      <p>A useful test: <em>could you explain and reproduce every part of your submission independently?</em> And: <em>have you shared your own work in a way that would let someone else copy it?</em> Sharing your work can also make you part of a collusion case.</p>
      <p>Group assignments have their own rules about what should be produced jointly and what individually. Check them carefully.</p>` },
    { h: 'Referencing and acknowledgement', html: `
      <p>Acknowledgement goes beyond referencing sources. Depending on guidance, you may need to acknowledge help from tools, translators, proofreaders or AI systems. Many institutions now ask students to complete an <strong>AI declaration</strong> or acknowledgement statement describing which tools were used and how.</p>` },
    { h: 'Generative AI as a potential learning support tool', html: `
      <p>${G('Generative AI')} tools produce text, images, code or other content in response to prompts. They generate plausible output based on patterns in their training data; they do not &lsquo;know&rsquo; whether their output is true. Where permitted, they can support learning by helping you to:</p>
      <ul>
        <li><strong>explore concepts</strong>: asking for an explanation of a difficult idea in simpler terms or with an example;</li>
        <li><strong>plan your learning</strong>: creating a revision timetable or breaking a task into steps;</li>
        <li><strong>practise</strong>: generating quiz questions to test your understanding;</li>
        <li><strong>receive formative feedback</strong>: asking for comments on the clarity of your own draft, where the assessment allows this.</li>
      </ul>
      <p>The key distinction is between AI that supports <em>your</em> learning and thinking, and AI that replaces it.</p>` },
    { h: 'Verifying AI-generated information', html: `
      <p>AI tools can produce confident but incorrect statements, sometimes called ${G('hallucinations', 'Hallucination (AI)')}. Always:</p>
      <ul>
        <li>check facts against reliable sources, such as your module materials, textbooks or peer-reviewed research;</li>
        <li>be particularly careful with statistics, dates, quotations and legal or technical details;</li>
        <li>remember that AI output may reflect biases in its training data;</li>
        <li>never cite an AI tool as if it were an academic source of evidence.</li>
      </ul>` },
    { h: 'The risk of fabricated references', html: `
      <p>AI tools may generate references that look genuine (plausible authors, titles and journals) but do not exist, or that exist but do not say what the AI claims. Including these in your work misrepresents your reading and may be treated as fabrication. <strong>Only cite sources you have located and read yourself.</strong></p>` },
    { h: 'Permitted assistance and unauthorised AI use', html: `
      <p>Institutions increasingly specify the level of AI use permitted for each assessment, for example:</p>
      <ul>
        <li><strong>No AI use</strong>: often for examinations or assessments of core skills;</li>
        <li><strong>AI for planning or idea generation only</strong>;</li>
        <li><strong>AI for editing or feedback on your own work</strong>;</li>
        <li><strong>AI as an integral part of the task</strong>, with acknowledgement.</li>
      </ul>
      <p>Submitting AI-generated work as your own where this is not permitted, or without required disclosure, is likely to be treated as academic misconduct. Using AI in permitted ways, transparently, is not.</p>` },
    { h: 'Following regulations and disclosure requirements', html: `
      <ul>
        <li>Read Blackpool and The Fylde College's academic integrity and AI policies.</li>
        <li>Check each assignment brief for its specific AI guidance.</li>
        <li>If guidance is unclear, <strong>ask your module tutor before you use AI</strong>, not afterwards.</li>
        <li>Keep records of your process (notes, drafts and any AI prompts) in case you need to show how your work developed.</li>
        <li>Never upload confidential, personal or placement data, or other people's work, into AI tools without permission.</li>
      </ul>` }
  ],
  examples: [
    { title: 'Using AI to explore a concept', disc: 'Cyber Security',
      weak: 'Asking an AI tool to "write 500 words on public key cryptography" and pasting the response into an assignment.',
      strong: 'Asking an AI tool to explain public key cryptography using an everyday analogy, checking the explanation against the module textbook, and then writing your own explanation with citations to the textbook.',
      why: 'The second approach uses AI to support understanding, verifies the output against reliable sources, and produces work that is genuinely the student\'s own.' },
    { title: 'An AI acknowledgement statement', disc: 'Business',
      weak: 'Submitting work without mentioning that AI was used to suggest a structure, when the brief requires disclosure.',
      strong: '"I used [name of AI tool] to generate a list of possible headings for this report, which I then revised. All analysis, writing and references are my own. I verified all factual information against the sources cited." (The exact format should follow Blackpool and The Fylde College\'s template.)',
      why: 'Transparent acknowledgement allows the marker to understand how AI contributed, as required by the assessment.' }
  ],
  more: [
    { title: 'Why AI detection is not a simple answer', html: `<p>Tools that claim to detect AI-generated text are not fully reliable and can produce false results. Institutions usually consider a range of evidence when concerns arise, which may include discussing the work with the student. Keeping drafts and notes helps you to demonstrate your process.</p>` },
    { title: 'If you are worried about academic integrity', html: `<p>If you think you may have made a mistake, or you are unsure what is permitted, speak to your module tutor, personal tutor or academic skills service as early as possible. If you are involved in an academic integrity process, ask about the student support available at Blackpool and The Fylde College.</p>` }
  ],
  activities: [
    { type: 'classify', title: 'Integrity and AI scenarios', layout: 'bins',
      instructions: '<p>Read each scenario and decide whether the behaviour is generally <strong>appropriate</strong>, <strong>inappropriate</strong>, or whether it <strong>depends on the assessment guidance</strong>. The feedback explains the reasoning, but in real situations, always check Blackpool and The Fylde College\'s policies.</p>',
      categories: [
        { id: 'ok', label: 'Appropriate', desc: 'Generally acceptable practice' },
        { id: 'no', label: 'Inappropriate', desc: 'Likely to breach integrity rules' },
        { id: 'dep', label: 'Depends on guidance', desc: 'Check the brief and policy' } ],
      items: [
        { t: 'Asking an AI tool to explain a difficult concept from a lecture in simpler terms, then checking the explanation against the module textbook.', cat: 'ok', fb: 'Using AI to support understanding, and verifying the output, is generally regarded as a legitimate study approach.' },
        { t: 'Pasting the assignment brief into an AI tool and submitting its essay with minor changes, without any declaration.', cat: 'no', fb: 'The submission does not represent the student\'s own work and the AI use is undisclosed. This is likely to be treated as misconduct.' },
        { t: 'Using an AI tool to check the grammar and suggest clearer phrasing in a draft you have written yourself.', cat: 'dep', fb: 'Many assessments permit this, but some do not, for example where language skills are being assessed. Disclosure may be required.' },
        { t: 'Asking an AI tool for references on a topic and copying them into your reference list without finding or reading the sources.', cat: 'no', fb: 'The references may not exist or may not support your claims. Citing unread sources misrepresents your research.' },
        { t: 'Using an AI tool to generate practice questions to test yourself before an examination.', cat: 'ok', fb: 'This supports revision and does not produce assessed work. Check the answers against your notes.' },
        { t: 'Using an AI tool to produce a detailed outline for your essay, which you then follow.', cat: 'dep', fb: 'Some assessments permit AI for planning; others require planning to be your own. Disclosure is often required.' },
        { t: 'Sending your completed individual assignment to a friend on the same module "for inspiration".', cat: 'no', fb: 'Sharing completed individual work risks collusion, for both students, if any of it is reused.' },
        { t: 'Uploading confidential client data from your work placement into a public AI tool to help analyse it.', cat: 'no', fb: 'This may breach confidentiality and data protection obligations, regardless of the academic rules.' },
        { t: 'In a Digital Media module whose brief explicitly permits AI-generated imagery with acknowledgement, using AI to create background images and declaring this in your submission.', cat: 'ok', fb: 'The use is permitted by the brief and transparently acknowledged.' },
        { t: 'Writing your assignment in your first language and using an AI tool to translate it into English for submission.', cat: 'dep', fb: 'Institutions treat this differently: some consider it unauthorised assistance, particularly where English language ability is assessed. Ask before doing this.' },
        { t: 'Discussing ideas for an individual assignment in a study group, then each writing your own answer independently.', cat: 'ok', fb: 'Discussion is usually encouraged; collusion occurs when written work is shared or produced jointly.' }
      ] },
    { type: 'choice', title: 'What would you do?',
      instructions: '<p>Choose the most appropriate response to each scenario.</p>',
      items: [
        { prompt: '<p>An AI tool gives you this reference: <em>Smith, J. (2020) &lsquo;Cloud security in SMEs&rsquo;, Journal of Cloud Computing Research, 12(4), pp. 33-48.</em> It looks perfect for your essay.</p>',
          parts: [{ kind: 'single', legend: 'What should you do?', options: [
            { t: 'Add it to your reference list, because it is correctly formatted.', fb: 'Correct formatting does not mean the source exists or says what the AI claims.' },

            { t: 'Cite the AI tool instead of the article.', fb: 'An AI tool is not a source of evidence for research findings. Find genuine sources.' } ] }] },
        { prompt: '<p>Your assignment brief does not mention AI at all, and you would like to use an AI tool to get feedback on the clarity of your draft.</p>',
          parts: [{ kind: 'single', legend: 'What should you do?', options: [

            { t: 'Check Blackpool and The Fylde College\'s AI policy and ask your module tutor before using it.', ok: true, fb: 'Asking first is the safest approach and shows good academic practice.' },
            { t: 'Use it, but do not mention it in case it is not allowed.', fb: 'Deliberately concealing AI use is likely to be treated seriously.' } ] }] }

  ],
  reflection: [

  check: [
    { q: 'Which statement about generative AI in higher education is most accurate?', options: [
      'All use of AI is academic misconduct.',

      'Whether AI use is acceptable depends on Blackpool and The Fylde College regulations and the specific assessment requirements.',
      'AI is only permitted for Computing students.'], answer: 2,

TOPICS.push({
  id: 't10', num: 10, time: '40 min',
  title: 'Editing, Proofreading and Improving Academic Work',
  short: 'Editing and proofreading',
  summary: 'Practical techniques for revising structure and argument, improving sentences, and proofreading for accuracy and British English conventions.',
  disciplines: ['Education', 'Computing', 'Business'],
  focus: 'editing for clarity and coherence, proofreading grammar and spelling, and checking work against the brief',

    'Review work against an assignment brief and assessment criteria.',
    'Apply British English spelling and academic conventions consistently.'
  ],
  intro: `
    <p>Very few writers produce their best work in a first draft. Revising is where a draft becomes a strong assignment: arguments are sharpened, paragraphs reorganised and errors removed.</p>
    <p>Leave time for this. Even a day between drafting and revising helps you to read your work as your marker will.</p>`,
  content: [
    { h: 'Editing and proofreading', html: `
      <div class="table-wrap"><table>
        <caption>Editing and proofreading compared</caption>
        <thead><tr><th scope="col"></th><th scope="col">${G('Editing')}</th><th scope="col">${G('Proofreading')}</th></tr></thead>
        <tbody>
          <tr><th scope="row">Focus</th><td>Content, argument, structure, clarity</td><td>Surface accuracy: spelling, grammar, punctuation, formatting</td></tr>
          <tr><th scope="row">Questions</th><td>Does this answer the question? Is the argument logical? Is anything missing or irrelevant?</td><td>Are there typing errors? Is punctuation correct? Are references consistent?</td></tr>
          <tr><th scope="row">When</th><td>First: there is no point polishing a paragraph you might delete</td><td>Last, once the content is settled</td></tr>
        </tbody>
      </table></div>
      <p>A useful order: <strong>brief and criteria → argument and structure → paragraphs → sentences → references → proofreading</strong>.</p>` },
    { h: 'Improving clarity and sentence construction', html: `
      <ul>
        <li>Aim for one main idea per sentence. Split sentences that try to do too much.</li>
        <li>Keep the subject and verb close together: <em>&lsquo;The survey, which was distributed to 200 staff across three sites over a four-week period in 2025, found&hellip;&rsquo;</em> is harder to follow than <em>&lsquo;The survey found&hellip;. It was distributed&hellip;&rsquo;</em>.</li>
        <li>Prefer the active voice when it makes clear who did what.</li>
        <li>Vary sentence length to maintain readability.</li>

  ['Claim', 'A statement you want the reader to accept, which needs to be supported by evidence and reasoning.'],

  ['Descriptive writing', 'Writing that reports what something is or what happened, without analysing or evaluating it.'],

     time the learner completes the activity in this visit.
     ================================================================ */
  const TASK_LABEL = { choice: 'Applied questions', sequence: 'Sequencing', classify: 'Classification', match: 'Matching', spot: 'Spot the problem', write: 'Writing practice' };

  function rChoice(task, ctx) {
    const wrap = el('<div class="choice-set"></div>');
    const first = new Array(task.items.length).fill(undefined);
    const summary = el('<div class="task-summary" aria-live="polite"></div>');
    task.items.forEach((item, ii) => {
      const card = el(`<div class="q-item"><p class="q-count">Item ${ii + 1} of ${task.items.length}</p><div class="q-prompt">${item.prompt}</div></div>`);
      const parts = item.parts.map(part => {
        const name = nid('opt');
        const multi = part.kind === 'multi';
        const idx = part.options.map((_, i) => i);
        const order = part.shuffle === false ? idx : shuffle(idx);
        const fs = el(`<fieldset class="options${multi ? ' multi' : ''}"><legend>${part.legend}</legend>${order.map(i => `<label class="opt"><input type="${multi ? 'checkbox' : 'radio'}" name="${name}" value="${i}"><span class="opt-text">${part.options[i].t}</span></label>`).join('')}</fieldset>`);
        card.appendChild(fs);
        return { part, fs };
      });
      if (item.own) {
        const model = item.parts[0].options.find(o => o.ok);
        const tid = nid('own');
        const own = el(`<details class="own"><summary>Write your own academic version (optional)</summary><div class="own-body"><label for="${tid}">Your version</label><textarea id="${tid}" rows="3" spellcheck="true" lang="en-GB"></textarea><button type="button" class="btn btn-ghost btn-sm">Compare with a model answer</button><div class="own-model" hidden><p class="ex-label">One possible model answer</p><p>${model ? model.t : ''}</p><p class="small muted">There are many acceptable versions. Check that yours is formal, precise, appropriately cautious and supported by evidence.</p></div></div></details>`);
        own.querySelector('button').addEventListener('click', () => { const m = own.querySelector('.own-model'); m.hidden = false; announce('Model answer shown.'); });
        card.appendChild(own);
      }
      const actions = el('<div class="actions"><button type="button" class="btn">Check answer</button></div>');
      const fb = el('<div class="feedback" aria-live="polite"></div>');
      card.append(actions, fb);
      actions.querySelector('button').addEventListener('click', () => {
        let all = true, html = '', missing = false;
        parts.forEach(({ part, fs }) => {
          const chosen = [...fs.querySelectorAll('input:checked')].map(i => +i.value);
          fs.querySelectorAll('label.opt').forEach(l => l.classList.remove('is-right', 'is-wrong', 'is-missed'));
          if (!chosen.length) { missing = true; return; }
          const correct = part.options.map((o, i) => (o.ok ? i : -1)).filter(i => i >= 0);
          let ok;
          if (part.kind === 'multi') {
            ok = chosen.length === correct.length && chosen.every(i => correct.includes(i));
            const lines = part.options.map((o, i) => {
              const sel = chosen.includes(i);
              let tag;
              if (o.ok && sel) tag = `${ICON.ok} <strong>Identified:</strong>`;
              else if (o.ok) tag = `${ICON.no} <strong>Missed:</strong>`;
              else if (sel) tag = `${ICON.no} <strong>Not a weakness here:</strong>`;
              else tag = `${ICON.ok} <strong>Correctly left unselected:</strong>`;
              return `<li>${tag} ${o.t}. ${o.fb || ''}</li>`;
            });
            fs.querySelectorAll('label.opt').forEach(l => {
              const i = +l.querySelector('input').value; const sel = chosen.includes(i);
              if (sel && part.options[i].ok) l.classList.add('is-right');
              else if (sel) l.classList.add('is-wrong');
              else if (part.options[i].ok) l.classList.add('is-missed');
            });
            html += `<ul class="fb-list">${lines.join('')}</ul>`;
          } else {
            const c = chosen[0];
            ok = !!part.options[c].ok;
            const lab = fs.querySelector(`input[value="${c}"]`).closest('label');
            lab.classList.add(ok ? 'is-right' : 'is-wrong');
            html += `<p>${ok ? ICON.ok : ICON.no} ${part.options[c].fb || ''}</p>`;
            if (!ok && correct.length) {
              const co = part.options[correct[0]];
              html += `<details class="reveal"><summary>Show the suggested answer</summary><p><strong>${co.t}</strong></p>${co.fb ? `<p>${co.fb}</p>` : ''}</details>`;
            }
          }
          if (!ok) all = false;
        });
        if (missing) { fb.className = 'feedback note'; fb.innerHTML = `<p>${ICON.info} Please answer every part of this item before checking.</p>`; return; }
        if (first[ii] === undefined) first[ii] = all;
        fb.className = 'feedback ' + (all ? 'ok' : 'no');
        fb.innerHTML = `<p class="fb-head">${all ? ICON.ok + ' Correct.' : ICON.no + ' Not quite yet. Read the feedback, then try again.'}</p>${html}${item.explain ? `<p>${item.explain}</p>` : ''}`;
        if (first.every(v => v !== undefined) && !wrap.dataset.done) {
          wrap.dataset.done = '1';
          const s = first.filter(Boolean).length;
          summary.innerHTML = `<p>${ICON.ok} <strong>Activity complete.</strong> You answered ${s} of ${first.length} items fully correctly at the first attempt. You can continue to revisit any item.</p>`;
          summary.className = 'task-summary done';
          ctx.done(s, first.length);
        }
      });
      wrap.appendChild(card);
    });
    wrap.appendChild(summary);
    return wrap;
  }

  function rSequence(task, ctx) {
    const n = task.items.length;
    const ident = [...Array(n).keys()];
    let order = shuffle(ident);
    while (n > 1 && order.every((v, i) => v === i)) order = shuffle(ident);
    const wrap = el(`<div class="sequence"><ol class="seq-list" aria-label="Sentences in their current order"></ol><div class="actions"><button type="button" class="btn" data-a="check">Check order</button><button type="button" class="btn btn-ghost" data-a="show">Show correct order</button></div><div class="feedback" aria-live="polite"></div></div>`);
    const list = wrap.querySelector('ol');
    const fb = wrap.querySelector('.feedback');
    let recorded = false;
    function draw(focusPos, dir) {
      list.innerHTML = '';
      order.forEach((itemIdx, pos) => {
        const it = task.items[itemIdx];
        const short = esc(trunc(stripTags(it.t), 45));
        list.appendChild(el(`<li class="seq-item" draggable="true" data-pos="${pos}">
          <span class="seq-pos" aria-hidden="true">${pos + 1}</span>
          <div class="seq-text"><p>${it.t}</p><p class="seq-result" hidden></p></div>
          <div class="seq-ctrls">
            <button type="button" class="icon-btn" data-move="-1" aria-label="Move up: ${short}" ${pos === 0 ? 'disabled' : ''}>${ICON.up}<span class="btn-txt">Up</span></button>
            <button type="button" class="icon-btn" data-move="1" aria-label="Move down: ${short}" ${pos === n - 1 ? 'disabled' : ''}>${ICON.down}<span class="btn-txt">Down</span></button>
          </div></li>`));
      });
      if (focusPos != null) {
        const li = list.children[focusPos];
        let b = li.querySelector(`[data-move="${dir}"]`);
        if (!b || b.disabled) b = li.querySelector('[data-move]:not([disabled])');
        if (b) b.focus();
      }
    }
    function clearFb() { fb.className = 'feedback'; fb.innerHTML = ''; }
    function correctCount() { return order.filter((v, i) => v === i).length; }
    function check() {
      let correct = 0;
      [...list.children].forEach((li, pos) => {
        const itemIdx = order[pos];
        const ok = itemIdx === pos;
        if (ok) correct++;
        li.classList.toggle('is-right', ok);
        li.classList.toggle('is-wrong', !ok);
        const r = li.querySelector('.seq-result');
        r.hidden = false;
        r.innerHTML = ok ? `${ICON.ok} Correct position: <strong>${task.items[itemIdx].role}</strong>` : `${ICON.no} Not in the correct position yet`;
      });
      const all = correct === n;
      fb.className = 'feedback ' + (all ? 'ok' : 'no');
      fb.innerHTML = all
        ? `<p class="fb-head">${ICON.ok} Well done. This is a coherent order.</p>${task.explain || ''}`
        : `<p class="fb-head">${ICON.no} ${correct} of ${n} sentences are in the correct position.</p><p>Look for words that refer back to an earlier sentence (such as <em>this</em> or <em>such</em>) and for linking words that signal a contrast or conclusion (such as <em>however</em> or <em>therefore</em>). Adjust the order and check again, or show the correct order.</p>`;
      if (!recorded) { recorded = true; ctx.done(correct, n); }
    }
    list.addEventListener('click', e => {
      const b = e.target.closest('[data-move]');
      if (!b) return;
      const pos = +b.closest('li').dataset.pos;
      const d = +b.dataset.move;
      const np = pos + d;
      if (np < 0 || np >= n) return;
      [order[pos], order[np]] = [order[np], order[pos]];
      draw(np, d);
      clearFb();
      announce(`Moved to position ${np + 1} of ${n}.`);
    });
    let dragFrom = null;
    list.addEventListener('dragstart', e => {
      const li = e.target.closest('li'); if (!li) return;
      dragFrom = +li.dataset.pos; li.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', String(dragFrom)); } catch (err) { /* ignore */ }
    });
    list.addEventListener('dragend', () => { dragFrom = null; list.querySelectorAll('.dragging, .drop-target').forEach(x => x.classList.remove('dragging', 'drop-target')); });
    list.addEventListener('dragover', e => {
      if (dragFrom === null) return;
      e.preventDefault();
      const li = e.target.closest('li');
      list.querySelectorAll('.drop-target').forEach(x => x.classList.remove('drop-target'));
      if (li) li.classList.add('drop-target');
    });
    list.addEventListener('drop', e => {
      e.preventDefault();
      const li = e.target.closest('li');
      if (dragFrom === null || !li) return;
      const to = +li.dataset.pos;
      const [m] = order.splice(dragFrom, 1);
      order.splice(to, 0, m);
      dragFrom = null;
      draw();
      clearFb();
      announce(`Moved to position ${to + 1} of ${n}.`);
    });
    wrap.querySelector('[data-a="check"]').addEventListener('click', check);
    wrap.querySelector('[data-a="show"]').addEventListener('click', () => {
      if (!recorded) { recorded = true; ctx.done(correctCount(), n); }
      order = ident.slice();
      draw();
      check();
      announce('The correct order is now shown.');
    });
    draw();
    return wrap;
  }

  function rClassify(task, ctx) {
    const cats = task.categories;
    const catLabel = id => (cats.find(c => c.id === id) || {}).label || '';
    const base = task.items.map((it, i) => Object.assign({ i: i }, it));
    const items = task.ordered ? base : shuffle(base);
    const bins = task.layout === 'bins';
    const wrap = el(`<div class="classify ${bins ? 'has-bins' : 'as-list'}"></div>`);
    if (bins) wrap.appendChild(el('<p class="hint">' + ICON.info + ' Keyboard and touch users: use the <strong>Category</strong> menu on each card. Mouse users can also drag cards into the boxes.</p>'));
    const pool = el(`<div class="pool" data-cat=""><h4 class="bin-title">${bins ? 'Items to sort' : 'Sentences'}</h4><ul class="card-list"></ul></div>`);
    wrap.appendChild(pool);
    const binLists = {};
    if (bins) {
      const grid = el('<div class="bins"></div>');
      cats.forEach(c => {
        const b = el(`<div class="bin" data-cat="${c.id}"><h4 class="bin-title">${c.label}</h4>${c.desc ? `<p class="bin-desc">${c.desc}</p>` : ''}<ul class="card-list" aria-label="${esc(c.label)}"></ul><p class="bin-empty">Drop items here</p></div>`);
        grid.appendChild(b);
        binLists[c.id] = b.querySelector('ul');
      });
      wrap.appendChild(grid);
    }
    const fb = el('<div class="feedback" aria-live="polite"></div>');
    function clearFb() { fb.className = 'feedback'; fb.innerHTML = ''; }
    function updateEmpty() {
      wrap.querySelectorAll('.bin').forEach(b => b.classList.toggle('has-items', b.querySelector('ul').children.length > 0));
      pool.classList.toggle('is-empty', pool.querySelector('ul').children.length === 0);
    }
    function place(li, cat) {
      if (!bins) return;
      const sel = li.querySelector('select');
      const hadFocus = document.activeElement === sel;
      (cat ? binLists[cat] : pool.querySelector('ul')).appendChild(li);
      if (hadFocus) sel.focus();
      updateEmpty();
    }
    const cards = items.map((it, k) => {
      const sid = nid('sel');
      const li = el(`<li class="card-item"${bins ? ' draggable="true"' : ''} data-i="${it.i}">
        <div class="card-text">${task.ordered ? `<span class="card-num" aria-hidden="true">${k + 1}</span>` : ''}<div>${it.t}</div></div>
        <div class="card-ctrl"><label for="${sid}">Category${task.ordered ? ` for sentence ${k + 1}` : ''}</label>
        <select id="${sid}"><option value="">Choose…</option>${cats.map(c => `<option value="${c.id}">${c.label}</option>`).join('')}</select></div>
        <div class="card-fb" hidden></div></li>`);
      pool.querySelector('ul').appendChild(li);
      const sel = li.querySelector('select');
      sel.addEventListener('change', () => {
        place(li, sel.value);
        clearFb();
        li.classList.remove('is-right', 'is-wrong');
        li.querySelector('.card-fb').hidden = true;
        if (bins) announce(sel.value ? `Placed in ${catLabel(sel.value)}.` : 'Returned to items to sort.');
      });
      return li;
    });
    if (bins) {
      let dragEl = null;
      wrap.addEventListener('dragstart', e => {
        const li = e.target.closest('.card-item'); if (!li) return;
        dragEl = li; li.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', 'card'); } catch (err) { /* ignore */ }
      });
      wrap.addEventListener('dragend', () => {
        if (dragEl) dragEl.classList.remove('dragging');
        dragEl = null;
        wrap.querySelectorAll('.over').forEach(x => x.classList.remove('over'));
      });
      wrap.querySelectorAll('.bin, .pool').forEach(zone => {
        zone.addEventListener('dragover', e => { if (!dragEl) return; e.preventDefault(); zone.classList.add('over'); });
        zone.addEventListener('dragleave', e => { if (!zone.contains(e.relatedTarget)) zone.classList.remove('over'); });
        zone.addEventListener('drop', e => {
          e.preventDefault(); zone.classList.remove('over');
          if (!dragEl) return;
          const cat = zone.dataset.cat || '';
          const li = dragEl;
          li.querySelector('select').value = cat;
          place(li, cat);
          li.classList.remove('is-right', 'is-wrong');
          li.querySelector('.card-fb').hidden = true;
          clearFb();
          announce(cat ? `Placed in ${catLabel(cat)}.` : 'Returned to items to sort.');
        });
      });
    }
    const actions = el('<div class="actions"><button type="button" class="btn" data-a="check">Check answers</button><button type="button" class="btn btn-ghost" data-a="reset">Start again</button></div>');
    wrap.append(actions, fb);
    let recorded = false;
    actions.querySelector('[data-a="check"]').addEventListener('click', () => {
      const remaining = cards.filter(li => !li.querySelector('select').value).length;
      if (remaining) { fb.className = 'feedback note'; fb.innerHTML = `<p>${ICON.info} Please choose a category for every item (${remaining} still to sort).</p>`; return; }
      let correct = 0;
      cards.forEach(li => {
        const it = task.items[+li.dataset.i];
        const v = li.querySelector('select').value;
        const ok = v === it.cat;
        if (ok) correct++;
        li.classList.toggle('is-right', ok);
        li.classList.toggle('is-wrong', !ok);
        const f = li.querySelector('.card-fb');
        f.hidden = false;
        f.innerHTML = ok
          ? `<p>${ICON.ok} <strong>Correct: ${catLabel(it.cat)}.</strong> ${it.fb || ''}</p>`
          : `<p>${ICON.no} <strong>Suggested answer: ${catLabel(it.cat)}.</strong> ${it.fb || ''}</p>`;
      });
      const n = cards.length;
      fb.className = 'feedback ' + (correct === n ? 'ok' : 'no');
      fb.innerHTML = `<p class="fb-head">${correct === n ? ICON.ok : ICON.info} ${correct} of ${n} correct.</p><p>${correct === n ? 'Well done. Read the explanations to confirm your reasoning.' : 'Read the explanation on each card, because the reasoning matters more than the score. You can change your answers and check again.'}</p>`;
      if (!recorded) { recorded = true; ctx.done(correct, n); }
    });
    actions.querySelector('[data-a="reset"]').addEventListener('click', () => {
      cards.forEach(li => {
        li.querySelector('select').value = '';
        li.classList.remove('is-right', 'is-wrong');
        li.querySelector('.card-fb').hidden = true;
        if (bins) pool.querySelector('ul').appendChild(li);
      });
      updateEmpty(); clearFb();
      announce('All items have been returned to the start.');
    });
    updateEmpty();
    return wrap;
  }

  function rMatch(task, ctx) {
    const defs = shuffle(task.pairs.map((p, i) => ({ d: p.def, i: i })));
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const wrap = el(`<div class="match">
      <div class="match-defs"><h4 class="bin-title">Descriptions</h4><ul class="def-list">${defs.map((d, k) => `<li><span class="def-letter">${letters[k]}</span><span>${d.d}</span></li>`).join('')}</ul></div>
      <div class="match-terms"><h4 class="bin-title">Terms</h4><ul class="term-list"></ul></div>
      <div class="actions"><button type="button" class="btn">Check matches</button></div>
      <div class="feedback" aria-live="polite"></div></div>`);
    const tl = wrap.querySelector('.term-list');
    const rows = task.pairs.map((p, i) => {
      const sid = nid('m');
      const li = el(`<li class="term-row"><label for="${sid}">${p.term}</label><select id="${sid}"><option value="">Choose a description…</option>${defs.map((d, k) => `<option value="${d.i}">${letters[k]}: ${esc(trunc(stripTags(d.d), 60))}</option>`).join('')}</select><div class="card-fb" hidden></div></li>`);
      tl.appendChild(li);
      return { li, i };
    });
    const fb = wrap.querySelector('.feedback');
    let recorded = false;
    wrap.querySelector('.actions button').addEventListener('click', () => {
      const missing = rows.filter(r => !r.li.querySelector('select').value).length;
      if (missing) { fb.className = 'feedback note'; fb.innerHTML = `<p>${ICON.info} Please choose a description for every term (${missing} remaining).</p>`; return; }
      let c = 0;
      rows.forEach(r => {
        const v = +r.li.querySelector('select').value;
        const ok = v === r.i;
        if (ok) c++;
        r.li.classList.toggle('is-right', ok);
        r.li.classList.toggle('is-wrong', !ok);
        const f = r.li.querySelector('.card-fb');
        const k = defs.findIndex(d => d.i === r.i);
        f.hidden = false;
        f.innerHTML = ok ? `<p>${ICON.ok} Correct.</p>` : `<p>${ICON.no} The best match is <strong>${letters[k]}</strong>: ${task.pairs[r.i].def}</p>`;
      });
      fb.className = 'feedback ' + (c === rows.length ? 'ok' : 'no');
      fb.innerHTML = `<p class="fb-head">${c === rows.length ? ICON.ok : ICON.info} ${c} of ${rows.length} matched correctly.</p>`;
      if (!recorded) { recorded = true; ctx.done(c, rows.length); }
    });
    return wrap;
  }

  function rSpot(task, ctx) {
    const isList = task.display === 'list';
    const n = task.segments.length;
    const wrap = el(`<div class="spot ${isList ? 'spot-list' : 'spot-para'}">
      <p class="hint">${ICON.info} Select ${isList ? 'an entry' : 'a sentence'} to mark it as containing a problem. Selected items are shown with a solid border and the label &lsquo;Marked&rsquo;. <span class="spot-count" aria-live="polite">0 marked</span></p>
      <div class="spot-body"></div>
      <div class="actions"><button type="button" class="btn" data-a="check">Check answers</button><button type="button" class="btn btn-ghost" data-a="clear">Clear selections</button></div>
      <div class="feedback" aria-live="polite"></div></div>`);
    const body = wrap.querySelector('.spot-body');
    const btns = task.segments.map((s, i) => el(`<button type="button" class="seg" aria-pressed="false" data-i="${i}"><span class="seg-tag" aria-hidden="true"></span><span class="seg-text">${s.t}</span></button>`));
    if (isList) {
      const ul = el('<ul class="spot-entries"></ul>');
      btns.forEach(b => { const li = document.createElement('li'); li.appendChild(b); ul.appendChild(li); });
      body.appendChild(ul);
    } else {
      const p = el('<div class="spot-paragraph"></div>');
      btns.forEach(b => { p.appendChild(b); p.appendChild(document.createTextNode(' ')); });
      body.appendChild(p);
    }
    const fb = wrap.querySelector('.feedback');
    const countEl = wrap.querySelector('.spot-count');
    function refresh() {
      let c = 0;
      btns.forEach(b => {
        const on = b.getAttribute('aria-pressed') === 'true';
        if (on) c++;
        if (!b.classList.contains('checked')) b.querySelector('.seg-tag').textContent = on ? 'Marked' : '';
      });
      countEl.textContent = `${c} marked`;
    }
    btns.forEach(b => b.addEventListener('click', () => {
      b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      btns.forEach(x => { x.classList.remove('checked', 'seg-found', 'seg-missed', 'seg-false', 'seg-fine'); });
      fb.className = 'feedback'; fb.innerHTML = '';
      refresh();
    }));
    let recorded = false;
    wrap.querySelector('[data-a="check"]').addEventListener('click', () => {
      let right = 0, found = 0, issues = 0;
      const lines = [];
      btns.forEach((b, i) => {
        const seg = task.segments[i];
        const on = b.getAttribute('aria-pressed') === 'true';
        const label = `${isList ? 'Entry' : 'Sentence'} ${i + 1}`;
        b.classList.add('checked');
        b.classList.remove('seg-found', 'seg-missed', 'seg-false', 'seg-fine');
        const tag = b.querySelector('.seg-tag');
        if (seg.issue) issues++;
        if (seg.issue && on) { right++; found++; b.classList.add('seg-found'); tag.textContent = '✓ Problem found'; lines.push(`<li>${ICON.ok} <strong>${label}: problem identified.</strong> ${seg.issue}</li>`); }
        else if (seg.issue) { b.classList.add('seg-missed'); tag.textContent = '! Missed problem'; lines.push(`<li>${ICON.no} <strong>${label}: problem missed.</strong> ${seg.issue}</li>`); }
        else if (on) { b.classList.add('seg-false'); tag.textContent = '✗ No major problem'; lines.push(`<li>${ICON.no} <strong>${label}: no major problem here.</strong> This ${isList ? 'entry' : 'sentence'} is acceptable as written.</li>`); }
        else { right++; b.classList.add('seg-fine'); tag.textContent = '✓ Correctly left'; lines.push(`<li>${ICON.ok} <strong>${label}: correctly left unmarked.</strong></li>`); }
      });
      const all = right === n;
      fb.className = 'feedback ' + (all ? 'ok' : 'no');
      fb.innerHTML = `<p class="fb-head">${all ? ICON.ok : ICON.info} You identified ${found} of ${issues} problems, and ${right} of ${n} judgements were correct.</p><ol class="fb-list plain">${lines.join('')}</ol>${task.explain || ''}`;
      if (!recorded) { recorded = true; ctx.done(right, n); }
    });
    wrap.querySelector('[data-a="clear"]').addEventListener('click', () => {
      btns.forEach(b => { b.setAttribute('aria-pressed', 'false'); b.classList.remove('checked', 'seg-found', 'seg-missed', 'seg-false', 'seg-fine'); });
      fb.className = 'feedback'; fb.innerHTML = '';
      refresh();
    });
    return wrap;
  }

  function normaliseRef(s) {
    return s.replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"').replace(/[\u2013\u2014]/g, '-').replace(/\s+/g, ' ').trim();
  }
  function rWrite(task, ctx, id) {
    const tid = nid('w');
    const hasMarks = /data-n=/.test(task.model);
    const wrap = el(`<div class="write">
      ${task.source || ''}

      <textarea id="${tid}" rows="${task.rows || 5}" spellcheck="true" lang="en-GB" aria-describedby="${tid}-wc"></textarea>

      <div class="feedback" aria-live="polite"></div>

        <p class="small muted">${ICON.info} The comparison is a guide only. Your answer does not need to match the model word for word to be effective.</p>
      </div></div>`);
    const ta = wrap.querySelector('textarea');
    const wc = wrap.querySelector(`#${tid}-wc`);
    const saveState = wrap.querySelector('.save-state');
    ta.value = S.writes[id] || '';
    const count = () => { const w = (ta.value.match(/\S+/g) || []).length; wc.textContent = `${w} word${w === 1 ? '' : 's'}`; return w; };
    count();
    let t;
    ta.addEventListener('input', () => {
      count();
      clearTimeout(t);
      t = setTimeout(() => { S.writes[id] = ta.value; save(); saveState.textContent = Store.ok ? 'Saved in this browser' : 'Not saved: browser storage unavailable'; }, 500);
    });
    const fb = wrap.querySelector('.feedback');
    const result = wrap.querySelector('.write-result');
    let recorded = false;
    function show() {
      result.hidden = false;
      fb.className = 'feedback'; fb.innerHTML = '';
      const v = ta.value;
      const checks = wrap.querySelector('.checks');
      if (task.checks && v.trim()) {
        const nv = normaliseRef(v);
        const lines = task.checks.map(c => { const ok = new RegExp(c.re).test(nv); return `<li class="${ok ? 'ok' : 'no'}">${ok ? ICON.ok + ' <span class="sr-only">Present:</span>' : ICON.no + ' <span class="sr-only">Not found:</span>'} ${c.label}</li>`; });
        let exactMsg = '';
        if (task.exact) {
          const same = normaliseRef(v).replace(/\.$/, '') === normaliseRef(task.exact).replace(/\.$/, '');
          exactMsg = same ? `<p>${ICON.ok} <strong>Your entry matches the model entry.</strong> In your assignment, the title would be in italics.</p>` : `<p>${ICON.info} Your entry differs from the model in some way. Use the element checks below and compare carefully with the model, paying attention to punctuation.</p>`;
        }
        checks.innerHTML = `<div class="feedback ${lines.every(l => l.startsWith('<li class="ok"')) ? 'ok' : 'no'}">${exactMsg}<p class="ex-label">Element checks</p><ul class="fb-list plain">${lines.join('')}</ul><p class="small muted">These checks look for each element in the expected format. They cannot check italics.</p></div>`;
      } else { checks.innerHTML = ''; }
      if (!recorded) { recorded = true; ctx.done(null, null); }
      announce('Model answer shown below your text.');
    }
    wrap.querySelector('[data-a="compare"]').addEventListener('click', () => {
      if (!ta.value.trim()) {
        fb.className = 'feedback note';
        fb.innerHTML = `<p>${ICON.info} You will get more from this activity if you write your own version first.</p><button type="button" class="btn btn-ghost btn-sm">Show the model anyway</button>`;
        fb.querySelector('button').addEventListener('click', show);
        return;
      }
      show();
    });
    return wrap;
  }

  // Highlights the "On this page" link for the section currently in view.
  let sectionObserver = null;
  function watchSections(main) {
    if (sectionObserver) { sectionObserver.disconnect(); sectionObserver = null; }
    if (!('IntersectionObserver' in window)) return;
    const links = [...main.querySelectorAll('.toc a')];
    const visible = new Set();
    sectionObserver = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) visible.add(e.target.id); else visible.delete(e.target.id); });
      const current = links.find(a => visible.has(a.getAttribute('href').slice(1)));
      if (!current) return;
      links.forEach(a => { if (a === current) a.setAttribute('aria-current', 'location'); else a.removeAttribute('aria-current'); });
    }, { rootMargin: '-20% 0px -60% 0px' });
    main.querySelectorAll('section[id^="sec-"]').forEach(s => sectionObserver.observe(s));
  }

  /* ---------- Knowledge check ---------- */
  function renderCheck(container, t) {
    container.innerHTML = '';
    const prevRes = S.topics[t.id] && S.topics[t.id].check;
    const form = el(`<form class="kc card" novalidate>${prevRes ? `<p class="prev-note">${ICON.info} Your latest score was ${prevRes.score} of ${prevRes.total}${prevRes.best != null ? ` (best: ${prevRes.best} of ${prevRes.total})` : ''}.</p>` : ''}</form>`);
    const qs = t.check.map((q, qi) => {
      const name = nid('kc');
      const order = q.fixed ? q.options.map((_, i) => i) : shuffle(q.options.map((_, i) => i));
      const fs = el(`<fieldset class="options kc-q"><legend><span class="q-num">Question ${qi + 1} of ${t.check.length}</span> ${q.q}</legend>${order.map(i => `<label class="opt"><input type="radio" name="${name}" value="${i}"><span class="opt-text">${q.options[i]}</span></label>`).join('')}<div class="feedback" aria-live="polite"></div></fieldset>`);
      form.appendChild(fs);
      return { q, fs };
    });
    const actions = el('<div class="actions"><button type="submit" class="btn">Submit answers</button></div>');
    const result = el('<div class="kc-result" aria-live="polite"></div>');
    form.append(actions, result);
    form.addEventListener('submit', e => {
      e.preventDefault();
      const unanswered = qs.filter(x => !x.fs.querySelector('input:checked')).length;
      if (unanswered) { result.className = 'kc-result feedback note'; result.innerHTML = `<p>${ICON.info} Please answer all questions (${unanswered} remaining).</p>`; return; }
      let score = 0;
      qs.forEach(({ q, fs }) => {
        const v = +fs.querySelector('input:checked').value;
        const ok = v === q.answer;
        if (ok) score++;
        fs.querySelectorAll('label.opt').forEach(l => {
          l.classList.remove('is-right', 'is-wrong');
          const i = +l.querySelector('input').value;
          if (i === v) l.classList.add(ok ? 'is-right' : 'is-wrong');
          if (!ok && i === q.answer) l.classList.add('is-missed');
          l.querySelector('input').disabled = true;
        });
        const f = fs.querySelector('.feedback');
        f.className = 'feedback ' + (ok ? 'ok' : 'no');
        f.innerHTML = ok ? `<p>${ICON.ok} <strong>Correct.</strong> ${q.explain}</p>` : `<p>${ICON.no} <strong>Not quite.</strong> The best answer is: <em>${q.options[q.answer]}</em></p><p>${q.explain}</p>`;
      });
      const total = qs.length;
      const s = ts(t.id);
      const best = Math.max(score, s.check && s.check.best != null ? s.check.best : 0);
      s.check = { score: score, total: total, best: best, date: Date.now() };
      save();
      updateTopicProgress(t);
      const next = TOPICS[t.num];
      const completeMsg = isComplete(t)
        ? `<p>${ICON.st_complete} <strong>You have completed Topic ${t.num}.</strong> ${next ? `Continue to <a href="#/topic/${next.num}">Topic ${next.num}: ${next.title}</a>.` : 'You are ready for the <a href="#/workshop">writing workshop</a> and the <a href="#/assessment">final assessment</a>.'}</p>`
        : `<p>${ICON.info} To complete this topic, also finish all the practice activities above.</p>`;
      const msg = score === total ? 'Excellent. You answered every question correctly.' : score >= total / 2 ? 'A good foundation. Review the explanations for any questions you missed.' : 'Review the explanations above and revisit the relevant sections of this topic before trying again.';
      result.className = 'kc-result feedback ' + (score === total ? 'ok' : 'no');
      result.innerHTML = `<p class="fb-head">You scored ${score} of ${total} (${pct(score, total)}%).</p><p>${msg}</p>${completeMsg}<button type="button" class="btn btn-ghost btn-sm" data-a="retry">Try the knowledge check again</button>`;
      actions.hidden = true;
      result.querySelector('[data-a="retry"]').addEventListener('click', () => { renderCheck(container, t); container.querySelector('legend').focus && container.querySelector('input').focus(); });
      announce(`Knowledge check submitted. You scored ${score} of ${total}.`);
    });
    container.appendChild(form);
  }

  /* ---------- Writing workshop ---------- */
  const CHECK_TOPIC = { topic: 2, tone: 3, structure: 2, evidence: 5, citation: 7, analysis: 4, question: 8 };
  function findWords(text, list) {
    const found = [];
    list.forEach(w => {
      const re = new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '\\s+') + '\\b', 'gi');
      const m = text.match(re);
      if (m) found.push(`${w} (${m.length})`);
    });
    return found;
  }
  function analyseDraft(text, w) {
    const words = (text.match(/\S+/g) || []).length;
    const sentences = text.split(/[.!?]+(?:\s+|$)/).filter(s => s.trim().split(/\s+/).length > 2);
    const avg = sentences.length ? Math.round(words / sentences.length) : 0;
    const cites = (text.match(/\((?:[^()]*?,\s*)?(?:19|20)\d{2}[a-z]?(?:,\s*pp?\.\s*\d+(?:[\u2013-]\d+)?)?\)|\((?:[^()]*?,\s*)?(?:no date|n\.d\.)\)/g) || []).length;
    const used = w.sources.filter(s => text.includes(s.cite.replace(/\s*\(.*$/, '').split(/ and | et al/)[0].trim()));
    const contractions = (text.match(/\b\w+n['\u2019]t\b|\b\w+['\u2019](?:re|ve|ll|m|d)\b|\b(?:it|that|there|what|who|here)['\u2019]s\b/gi) || []);
    const firstPerson = (text.match(/\b(?:I|[Mm]e|[Mm]y|[Ww]e|[Oo]ur|[Uu]s)\b/g) || []);
    const informal = findWords(text, ['loads', 'lots of', 'a lot', 'really', 'basically', 'stuff', 'kind of', 'sort of', 'a bit', 'gonna', 'okay', 'massive', 'awesome', 'nowadays', 'obviously', 'totally', 'pretty much']);
    const absolutes = findWords(text, ['always', 'never', 'everyone', 'everybody', 'nobody', 'proves', 'proved', 'definitely', 'undoubtedly']);
    const hedges = findWords(text, ['may', 'might', 'could', 'suggests', 'suggest', 'appears', 'appear', 'indicates', 'indicate', 'likely', 'tends']);
    const links = findWords(text, ['however', 'therefore', 'consequently', 'because', 'thus', 'although', 'whereas', 'as a result', 'furthermore', 'moreover', 'nevertheless', 'this suggests', 'this indicates', 'taken together']);
    const us = findWords(text, ['organize', 'organization', 'analyze', 'recognize', 'prioritize', 'utilize', 'emphasize', 'behavior', 'color', 'labor', 'center', 'favor']);
    const keys = w.keywords.filter(k => new RegExp('\\b' + k, 'i').test(text));
    const R = [];
    const add = (status, label, msg) => R.push({ status, label, msg });
    add(words >= 150 && words <= 250 ? 'good' : 'consider', 'Length', `${words} words. The task suggests about 150-250 words.`);
    add(avg && avg <= 35 ? 'good' : 'consider', 'Average sentence length', avg ? `About ${avg} words per sentence. Very long sentences (over about 35 words) can be hard to follow.` : 'No complete sentences detected yet.');
    add(cites >= 2 ? 'good' : 'consider', 'Citations detected', `${cites} citation pattern${cites === 1 ? '' : 's'} such as "Author (Year)" or "(Author, Year)". The task asks you to use at least two sources.`);
    add(used.length >= 2 ? 'good' : 'consider', 'Workshop sources mentioned', used.length ? `You appear to refer to: ${used.map(s => s.cite).join('; ')}.` : 'None of the workshop sources\' author names were found.');
    add(contractions.length ? 'consider' : 'good', 'Contractions', contractions.length ? `Possible contractions: ${[...new Set(contractions)].join(', ')}.` : 'None detected.');
    add(informal.length ? 'consider' : 'good', 'Informal words', informal.length ? `Consider whether these are appropriate: ${informal.join(', ')}.` : 'None of the common informal words in the checker\'s list were found.');
    add(absolutes.length ? 'consider' : 'good', 'Absolute terms', absolutes.length ? `Check these claims are fully supported: ${absolutes.join(', ')}.` : 'None detected.');
    add(hedges.length ? 'good' : 'consider', 'Cautious (hedging) language', hedges.length ? `Found: ${hedges.join(', ')}.` : 'No hedging words found. Consider whether any claims should be more cautious.');
    add(links.length >= 2 ? 'good' : 'consider', 'Linking and analytical language', links.length ? `Found: ${links.join(', ')}.` : 'Few linking words found. Analysis often uses words such as because, therefore and however.');
    add(firstPerson.length ? 'info' : 'good', 'First-person words', firstPerson.length ? `${firstPerson.length} found. This may be acceptable; check what the task and your discipline expect.` : 'None detected.');
    add(us.length ? 'consider' : 'good', 'American spellings', us.length ? `Possible American spellings: ${us.join(', ')}.` : 'None of the common American spellings in the checker\'s list were found.');
    add(keys.length === w.keywords.length ? 'good' : 'consider', 'Key terms from the question', keys.length === w.keywords.length ? 'The key terms from the question appear in your paragraph.' : `Consider linking explicitly to the question. Not found: ${w.keywords.filter(k => !keys.includes(k)).join(', ')}.`);
    return { words, R };
  }

  function renderWorkshop(main) {
    const w = WORKSHOP.find(x => x.id === S.workshop.q) || WORKSHOP[0];

          <div class="actions"><button type="button" class="btn" id="ws-run">Run checks on my draft</button></div>
          <div id="ws-results" aria-live="polite"></div>
        </li>
        <li class="card ws-step" aria-labelledby="ws5-h">
          <h2 id="ws5-h"><span class="step" aria-hidden="true">5</span>Self-assess your paragraph</h2>
          <p>Reread your paragraph and rate it honestly against each criterion. Your ratings are ${Store.ok ? 'saved in this browser' : 'not saved (storage unavailable)'}.</p>
          <div id="ws-check"></div>
          <div id="ws-check-summary" aria-live="polite"></div>
        </li>
        <li class="card ws-step" aria-labelledby="ws6-h">
          <h2 id="ws6-h"><span class="step" aria-hidden="true">6</span>Compare with an annotated model</h2>
          <p>We recommend completing your draft and self-assessment first. This is one possible strong response; effective paragraphs can take many forms.</p>
          <details class="panel model-panel"><summary>${ICON.info}<span>Show the annotated model response</span></summary><div class="panel-body">
            <p class="model-para">${w.model.map(s => `<mark data-n="${s.n}">${s.t}</mark>`).join(' ')}</p>
            <ol class="notes-list numbered">${w.notes.map(n => `<li><strong>${n.label}:</strong> ${n.t}</li>`).join('')}</ol>
          </div></details>
        </li>
      </ol>`;

    main.querySelectorAll('input[name="ws-q"]').forEach(r => r.addEventListener('change', () => {
      S.workshop.q = r.value; save();
      renderWorkshop(main);
      const sel = main.querySelector(`input[name="ws-q"][value="${r.value}"]`);
      if (sel) sel.focus();
      announce('Assignment question changed. The task, sources and model have been updated.');
    }));

    const ta = main.querySelector('#ws-draft');
    const wc = main.querySelector('#ws-wc');

    count();
    let timer;
    ta.addEventListener('input', () => {
      count();
      clearTimeout(timer);
      timer = setTimeout(() => {
        S.workshop.drafts[w.id] = ta.value; checkWorkshopDone(w); save();
        main.querySelector('#ws-save').textContent = Store.ok ? 'Draft saved in this browser' : 'Not saved: storage unavailable';
      }, 600);
    });

    main.querySelector('#ws-download').addEventListener('click', () => {
      const cl = S.workshop.checklist[w.id] || {};
      const ratings = WORKSHOP_CHECKLIST.map(c => `- ${c.label}: ${cl[c.id] || 'not rated'}`).join('\n');

      try {

    main.querySelector('#ws-run').addEventListener('click', () => {

      fs.querySelectorAll('input').forEach(i => i.addEventListener('change', () => { ratings[c.id] = i.value; checkWorkshopDone(w); save(); summarise(); }));

      const dev = WORKSHOP_CHECKLIST.filter(c => ratings[c.id] && ratings[c.id] !== 'Yes');
      out.innerHTML = `<div class="feedback ${dev.length ? 'no' : 'ok'}"><p class="fb-head">You rated ${yes} of ${WORKSHOP_CHECKLIST.length} criteria as fully met${rated.length < WORKSHOP_CHECKLIST.length ? ` (${WORKSHOP_CHECKLIST.length - rated.length} not yet rated)` : ''}.</p>${dev.length ? `<p>Suggestions for development:</p><ul>${dev.map(c => { const tn = CHECK_TOPIC[c.id]; const t = TOPICS[tn - 1]; return `<li><strong>${c.label}</strong>: revisit <a href="#/topic/${tn}">Topic ${tn}: ${t.title}</a>.</li>`; }).join('')}</ul>` : '<p>Compare your paragraph with the annotated model to confirm your judgement.</p>'}</div>`;
    }
    summarise();
    return 'Writing workshop';
  }
  function checkWorkshopDone(w) {
    const words = ((S.workshop.drafts[w.id] || '').match(/\S+/g) || []).length;
    const cl = S.workshop.checklist[w.id] || {};
    if (words >= 100 && WORKSHOP_CHECKLIST.every(c => cl[c.id])) S.workshop.done = true;
  }

  /* ---------- Final assessment ---------- */
  let AS = null;
  function startAssessment() {
    AS = {
      qs: shuffle(ASSESSMENT).map(q => {
        const o = Object.assign({}, q);
        if (q.type === 'set') o.sOrder = shuffle(q.statements.map((_, i) => i));
        else o.oOrder = q.fixed ? q.options.map((_, i) => i) : shuffle(q.options.map((_, i) => i));
        return o;
      }),
      i: 0, answers: {}, submitted: false, result: null
    };
  }
  const TYPE_LABEL = { mcq: 'Multiple choice', scenario: 'Scenario', classify: 'Classification', set: 'Classification set' };
  function isAnswered(q, a) { if (a == null) return false; if (q.type === 'set') return q.statements.every((_, i) => a[i] != null && a[i] !== ''); return true; }
  function isCorrect(q, a) { if (!isAnswered(q, a)) return false; if (q.type === 'set') return q.statements.every((s, i) => +a[i] === s.a); return +a === q.answer; }

  function renderAssessment(main) {
    if (!AS) return renderAssessIntro(main);
    if (AS.submitted) return renderAssessResults(main);
    return renderAssessQuestion(main);
  }
  function renderAssessIntro(main) {

      </div>
      ${at.length ? `<section class="card" aria-labelledby="as-hist"><h2 id="as-hist">Previous attempts</h2><div class="table-wrap"><table><caption class="sr-only">Previous assessment attempts</caption><thead><tr><th scope="col">Attempt</th><th scope="col">Date</th><th scope="col">Score</th></tr></thead><tbody>${at.map((a, i) => `<tr><td>${i + 1}</td><td>${fmtDate(a.date)}</td><td>${a.score} of ${a.total} (${pct(a.score, a.total)}%)</td></tr>`).join('')}</tbody></table></div></section>` : ''}`;
    main.querySelector('#as-start').addEventListener('click', () => { startAssessment(); render(); });

  }
  function renderAssessQuestion(main) {
    const q = AS.qs[AS.i];

    const a = AS.answers[AS.i];

    }
    main.innerHTML = `
      <header class="page-head compact"><p class="eyebrow">Final knowledge assessment</p><h1 class="h-sm">Question ${AS.i + 1} of ${n}</h1>

      <div class="aq-layout">

      </div>

    const record = () => {
      if (q.type === 'set') {
        const arr = AS.answers[AS.i] || {};
        main.querySelectorAll('select[data-si]').forEach(s => { arr[s.dataset.si] = s.value; });
